<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA - Savaş Raporları</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050d18;
  color: #eaf4ff;
}

.topbar {
  height: 76px;
  background: #071526;
  border-bottom: 1px solid #173451;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
}

.logo {
  font-size: 30px;
  letter-spacing: 7px;
  color: #16b9ff;
  font-weight: bold;
}

.player {
  color: #8fc9ef;
}

.player span {
  color: white;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: 35px auto;
  padding: 0 25px;
}

h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  color: #78b9e6;
  margin-bottom: 25px;
}
.section-title {
  margin-top: 30px;
  margin-bottom: 15px;
  color: #16b9ff;
  font-size: 22px;
}

.section-title:first-child {
  margin-top: 0;
}
.report {
  background: #091b2d;
  border: 1px solid #173e5d;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}

.report-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.victory {
  color: #58ff9b;
}

.defeat {
  color: #ff6868;
}

.draw {
  color: #ffd166;
}

.report p {
  color: #9cc6e2;
  margin: 7px 0;
}

.loot {
  margin-top: 12px;
  color: #ffffff;
}

.losses {
  margin-top: 12px;
  color: #ffb0b0;
}

.date {
  margin-top: 12px;
  color: #648ba8;
  font-size: 13px;
}

.loading {
  color: #78b9e6;
  padding: 20px 0;
}

.empty {
  background: #091b2d;
  border: 1px solid #173e5d;
  border-radius: 14px;
  padding: 25px;
  color: #8caec7;
}

.back {
  display: inline-block;
  margin-top: 10px;
  color: #16b9ff;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="topbar">

  <div class="logo">NEXORA</div>

  <div class="player">
    Oyuncu:
    <span id="playerName">Oyuncu</span>
  </div>

</div>

<div class="container">

  <h1>⚔️ Savaş Raporları</h1>

  <div class="subtitle">
    Gerçekleşen saldırılar, savaş sonuçları ve ganimetler.
  </div>

  <div id="reports">

    <div class="loading">
      Savaş raporları yükleniyor...
    </div>

  </div>

  <a class="back" href="game.html">
    ← Koloniye Dön
  </a>

</div>

<script>

const savedUser = JSON.parse(
  localStorage.getItem("nexora_player") || "null"
);

if (savedUser && savedUser.username) {
  document.getElementById("playerName").textContent =
    savedUser.username;
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text || "";

  return div.innerHTML;
}

function getResultClass(result) {

  if (result === "Zafer") {
    return "victory";
  }

  if (result === "Yenilgi") {
    return "defeat";
  }

  return "draw";
}

function formatDate(dateText) {

  const date = new Date(dateText);

  return date.toLocaleString("tr-TR");
}

function buildReport(report) {

  const card = document.createElement("div");

  card.className = "report";

  const attackerId =
    Number(report.attacker_player_id);

  const myId =
    savedUser ? Number(savedUser.id) : null;

  const attacker =
    attackerId === myId;

  const role =
    attacker ? "Saldıran" : "Savunan";
  const opponentName =
  attacker
    ? report.defender_username
    : report.attacker_username;

  card.innerHTML =

    '<div class="report-title ' +
getResultClass(report.result) +
'">' +
'⚔️ ' +
escapeHtml(report.result) +
' — ' +
escapeHtml(role) +
'</div>' +

'<p>' +
'<strong>Rakip:</strong> ' +
escapeHtml(opponentName || "Bilinmeyen Oyuncu") +
'</p>' +

    '<p>' +
    '<strong>Saldırı Gücü:</strong> ' +
    escapeHtml(String(report.attack_power)) +
    '</p>' +

    '<p>' +
    '<strong>Savunma Gücü:</strong> ' +
    escapeHtml(String(report.defense_power)) +
    '</p>' +

    '<div class="losses">' +
    '<strong>Asker Kayıpları</strong><br>' +
    'Saldıran Piyade: ' +
    escapeHtml(
      String(
        report.attacker_losses?.piyade || 0
      )
    ) +
    '<br>' +
    'Saldıran Saldırı Birliği: ' +
    escapeHtml(
      String(
        report.attacker_losses?.saldiri || 0
      )
    ) +
    '<br>' +
    'Savunma Birliği: ' +
    escapeHtml(
      String(
        report.defender_losses?.savunma || 0
      )
    ) +
    '</div>' +

    '<div class="loot">' +
    '<strong>Ganimet</strong><br>' +
    'Metal: ' +
    escapeHtml(
      String(report.loot?.metal || 0)
    ) +
    ' | Enerji: ' +
    escapeHtml(
      String(report.loot?.energy || 0)
    ) +
    '<br>' +
    'Su: ' +
    escapeHtml(
      String(report.loot?.water || 0)
    ) +
    ' | Kristal: ' +
    escapeHtml(
      String(report.loot?.crystal || 0)
    ) +
    '</div>' +

    '<div class="date">' +
    formatDate(report.created_at) +
    '</div>';

  return card;
}

async function loadReports() {
  const token = localStorage.getItem("nexora_token");
  const container = document.getElementById("reports");

  if (!token) {
    container.innerHTML =
      '<div class="empty">Oturum bulunamadı.</div>';
    return;
  }

  try {
    const response = await fetch(
      "/api/auth?action=reports",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      container.innerHTML =
        '<div class="empty">' +
        escapeHtml(
          data.message ||
          "Savaş raporları alınamadı."
        ) +
        "</div>";
      return;
    }

    const reports = data.reports || [];
    const myId = savedUser
      ? Number(savedUser.id)
      : null;

    const outgoingReports = reports.filter(function(report) {
      return Number(report.attacker_player_id) === myId;
    });

    const incomingReports = reports.filter(function(report) {
      return Number(report.defender_player_id) === myId;
    });

    container.innerHTML = "";

    if (outgoingReports.length > 0) {
      const outgoingTitle =
        document.createElement("h2");

      outgoingTitle.className = "section-title";
      outgoingTitle.textContent =
        "⚔️ Yaptığım Saldırılar";

      container.appendChild(outgoingTitle);

      outgoingReports.forEach(function(report) {
        container.appendChild(
          buildReport(report)
        );
      });
    }

    if (incomingReports.length > 0) {
      const incomingTitle =
        document.createElement("h2");

      incomingTitle.className = "section-title";
      incomingTitle.textContent =
        "🛡️ Gelen Saldırılar";

      container.appendChild(incomingTitle);

      incomingReports.forEach(function(report) {
        container.appendChild(
          buildReport(report)
        );
      });
    }

    if (
      outgoingReports.length === 0 &&
      incomingReports.length === 0
    ) {
      container.innerHTML =
        '<div class="empty">' +
        "Henüz savaş raporu bulunmuyor." +
        "</div>";
    }

  } catch (error) {
    console.error(
      "Rapor yükleme hatası:",
      error
    );

    container.innerHTML =
      '<div class="empty">' +
      "Savaş raporları yüklenirken hata oluştu." +
      "</div>";
  }
}
loadReports();

</script>

</body>
</html>
