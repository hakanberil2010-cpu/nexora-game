<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEXORA - Savaş Raporları</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}.container{max-width:1100px;margin:30px auto;padding:0 20px}.sub{color:#7196b8}.report{background:#091a2c;border:1px solid #173b5d;border-radius:14px;padding:20px;margin:16px 0}.title{font-size:21px;font-weight:bold}.win{color:#58ff9b}.loss{color:#ff6868}.draw{color:#ffd166}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.box{background:#071526;border:1px solid #17344f;border-radius:9px;padding:11px}.muted{color:#8db0cf}.bar{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#102e49}.unit-table{width:100%;border-collapse:collapse;margin-top:12px}.unit-table th,.unit-table td{padding:7px;border-bottom:1px solid #17344f;text-align:left;font-size:13px}.unit-table th{color:#8db0cf}.detail{margin-top:14px}.section{color:#18bfff;margin-top:28px}.back{display:inline-block;margin-top:18px;color:#18bfff;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="logo">NEXORA</div><div>Oyuncu: <strong id="player">Oyuncu</strong></div></div><div class="container"><h1>⚔️ Savaş Raporları</h1><div class="sub">Savaş sonucu, birlik kayıpları, ganimet, savaş puanı ve koordinatlar.</div><div id="reports">Yükleniyor...</div><a class="back" href="game.html">← Koloniye Dön</a></div><script>const token=localStorage.getItem('nexora_token');const u=JSON.parse(localStorage.getItem('nexora_player')||'null');if(!token)location.href='login.html';if(u?.username)player.textContent=u.username;const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const n=x=>Math.round(Number(x)||0).toLocaleString('tr-TR');function losses(obj){return Object.entries(obj||{}).filter(([,v])=>Number(v)>0).map(([k,v])=>`${esc(k)}: ${n(v)}`).join(' · ')||'Yok'}function build(r){const result=typeof r.result==='object'?r.result:((()=>{try{return JSON.parse(r.result||'{}')}catch{return {result:String(r.result||'')}}})());const cls=result.result==='Zafer'?'win':result.result==='Yenilgi'?'loss':'draw';const my=Number(r.attacker_player_id)===Number(u?.id);const bp=Number(r.battle_points??result.battlePoints??0);return `<div class="report"><div class="title ${cls}">${my?'⚔️ Yaptığım Saldırı':'🛡️ Gelen Saldırı'} — ${esc(result.result||'Bilinmiyor')}</div><div class="grid"><div class="box"><b>Saldıran</b><br>${esc(r.attacker_username||'Oyuncu')}<br><span class="muted">📍 X:${esc(r.attacker_x??'--')} Y:${esc(r.attacker_y??'--')}</span></div><div class="box"><b>Savunan</b><br>${esc(r.defender_username||'Oyuncu')}<br><span class="muted">📍 X:${esc(r.defender_x??'--')} Y:${esc(r.defender_y??'--')}</span></div><div class="box">⚔️ Saldırı Gücü<br><b>${n(r.attack_power??result.attackPower)}</b></div><div class="box">🛡️ Savunma Gücü<br><b>${n(r.defense_power??result.defensePower)}</b></div></div><div class="bar"><span class="pill">🏆 Savaş Puanı: ${n(bp)}</span><span class="pill">👑 Kazanan: ${result.winnerPlayerId?esc(result.winnerPlayerId):'Beraberlik'}</span></div><p class="muted">Saldıran kayıpları: ${losses(r.attacker_losses||result.attackerLosses)}</p><p class="muted">Savunan kayıpları: ${losses(r.defender_losses||result.defenderLosses)}</p><p>💰 Ganimet: Metal ${n((r.loot||result.loot)?.metal)} · Enerji ${n((r.loot||result.loot)?.energy)} · Su ${n((r.loot||result.loot)?.water)} · Kristal ${n((r.loot||result.loot)?.crystal)}</p>${(result.attackerBreakdown||result.defenderBreakdown)?`<div class=detail><b>⚔️ Birim savaş analizi</b><table class=unit-table><tr><th>Taraf</th><th>Birim</th><th>Seviye</th><th>Miktar</th><th>Avantaj</th><th>Güç</th></tr>${(result.attackerBreakdown||[]).map(x=>`<tr><td>Saldıran</td><td>${esc(x.unit_type)}</td><td>${n(x.level)}</td><td>${n(x.quantity)}</td><td>x${Number(x.matchupMultiplier||1).toFixed(3)}</td><td>${n(x.power)}</td></tr>`).join('')}${(result.defenderBreakdown||[]).map(x=>`<tr><td>Savunan</td><td>${esc(x.unit_type)}</td><td>${n(x.level)}</td><td>${n(x.quantity)}</td><td>x${Number(x.matchupMultiplier||1).toFixed(3)}</td><td>${n(x.power)}</td></tr>`).join('')}</table><p class=muted>🛡️ Yapı savunma bonusu: x${Number(result.defenseBonus||1).toFixed(2)} · ⚖️ Güç farkı oranı: %${(Number(result.advantageRatio||0)*100).toFixed(1)}</p></div>`:''}<small class="muted">${r.created_at?new Date(r.created_at).toLocaleString('tr-TR'):''}</small></div>`}async function load(){try{const r=await fetch('/api/auth?action=reports',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);const list=d.reports||[];reports.innerHTML=list.length?list.map(build).join(''):'<div class="report">Henüz savaş raporu yok.</div>'}catch(e){reports.innerHTML=`<div class="report">${esc(e.message||'Raporlar alınamadı.')}</div>`}}load();setInterval(load,15000);</script></body></html>
