<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEXORA - Savaş Raporları</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}.container{max-width:1100px;margin:30px auto;padding:0 20px}.sub{color:#7196b8}.report{background:#091a2c;border:1px solid #173b5d;border-radius:14px;padding:20px;margin:16px 0}.title{font-size:21px;font-weight:bold}.spyTitle{color:#c99cff}.win{color:#58ff9b}.loss{color:#ff6868}.draw{color:#ffd166}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.box{background:#071526;border:1px solid #17344f;border-radius:9px;padding:11px}.muted{color:#8db0cf}.bar{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#102e49}.unit-table{width:100%;border-collapse:collapse;margin-top:12px}.unit-table th,.unit-table td{padding:7px;border-bottom:1px solid #17344f;text-align:left;font-size:13px}.unit-table th{color:#8db0cf}.detail{margin-top:14px}.section{color:#18bfff;margin-top:28px}.back{display:inline-block;margin-top:18px;color:#18bfff;text-decoration:none}.accordion{margin-top:22px}.accBtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:12px;border:1px solid #1c4265;background:#0b2137;color:#eaf4ff;font-size:22px;font-weight:bold;cursor:pointer;text-align:left}.accBtn:hover{filter:brightness(1.06)}.accBtn .left{display:flex;align-items:center;gap:10px}.accBtn .right{display:flex;align-items:center;gap:10px;color:#8db0cf;font-size:14px;font-weight:normal}.accBtn .arrow{font-size:18px;transition:transform .2s ease}.accBtn.open .arrow{transform:rotate(180deg)}.accPanel{display:none;padding-top:8px}.accPanel.open{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.accBtn{font-size:18px}.accBtn .right{font-size:12px}}.topBack{display:inline-block;margin:0 0 18px;padding:10px 16px;border-radius:8px;background:#138dcc;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #1aa9ee}.topBack:hover{filter:brightness(1.08)}</style></head><body><div class="top"><div class="logo">NEXORA</div><div>Oyuncu: <strong id="player">Oyuncu</strong></div></div><div class="container"><a class="topBack" href="game.html">← Koloniye Dön</a><h1>📑 Raporlar</h1><div class="sub">Savaş ve casusluk raporlarını başlıklarına tıklayarak açıp kapatabilirsin.</div><div class="accordion"><button class="accBtn open" id="battleToggle" type="button"><span class="left">⚔️ Savaş Raporları</span><span class="right"><span id="battleCount">0</span> kayıt <span class="arrow">▾</span></span></button><div class="accPanel open" id="battlePanel"><div class="sub">Savaş sonucu, birlik kayıpları, ganimet, savaş puanı ve koordinatlar.</div><div id="reports">Yükleniyor...</div></div></div><div class="accordion"><button class="accBtn" id="spyToggle" type="button"><span class="left">🕵️ Casusluk Raporları</span><span class="right"><span id="spyCount">0</span> kayıt <span class="arrow">▾</span></span></button><div class="accPanel" id="spyPanel"><div class="sub">Gönderdiğin casusların sonuçları ve elde edilen istihbarat.</div><div id="espionageReports">Yükleniyor...</div></div></div><a class="back" href="game.html">← Koloniye Dön</a></div><script>const token=localStorage.getItem('nexora_token');const u=JSON.parse(localStorage.getItem('nexora_player')||'null');if(!token)location.href='login.html';if(u?.username)player.textContent=u.username;function clearInvalidSession(){localStorage.removeItem('nexora_token');localStorage.removeItem('nexora_player');location.href='login.html'}const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const n=x=>Math.round(Number(x)||0).toLocaleString('tr-TR');function setAccordion(btn,panel,open){btn.classList.toggle('open',open);panel.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false')}battleToggle.onclick=()=>setAccordion(battleToggle,battlePanel,!battlePanel.classList.contains('open'));spyToggle.onclick=()=>setAccordion(spyToggle,spyPanel,!spyPanel.classList.contains('open'));setAccordion(battleToggle,battlePanel,true);setAccordion(spyToggle,spyPanel,false);function losses(obj){return Object.entries(obj||{}).filter(([,v])=>Number(v)>0).map(([k,v])=>`${esc(k)}: ${n(v)}`).join(' · ')||'Yok'}function build(r){const result=typeof r.result==='object'?r.result:((()=>{try{return JSON.parse(r.result||'{}')}catch{return {result:String(r.result||'')}}})());const cls=result.result==='Zafer'?'win':result.result==='Yenilgi'?'loss':'draw';const my=Number(r.attacker_player_id)===Number(u?.id);const bp=Number(r.battle_points??result.battlePoints??0);const tacticKey=String(result.battleTactic||'').trim().toLowerCase();const tacticLabel=result.battleTacticLabel||({assault:'Hücum Düzeni',balanced:'Dengeli Düzen',cautious:'Temkinli Düzen'})[tacticKey]||'';const tacticIcon=tacticKey==='assault'?'⚔️':tacticKey==='cautious'?'🛡️':'⚖️';return `<div class="report"><div class="title ${cls}">${my?'⚔️ Yaptığım Saldırı':'🛡️ Gelen Saldırı'} — ${esc(result.result||'Bilinmiyor')}</div><div class="grid"><div class="box"><b>Saldıran</b><br>${esc(r.attacker_username||'Oyuncu')}<br><span class="muted">📍 X:${esc(r.attacker_x??'--')} Y:${esc(r.attacker_y??'--')}</span></div><div class="box"><b>Savunan</b><br>${esc(r.defender_username||'Oyuncu')}<br><span class="muted">📍 X:${esc(r.defender_x??'--')} Y:${esc(r.defender_y??'--')}</span></div><div class="box">⚔️ Saldırı Gücü<br><b>${n(r.attack_power??result.attackPower)}</b></div><div class="box">🛡️ Savunma Gücü<br><b>${n(r.defense_power??result.defensePower)}</b></div></div><div class="bar"><span class="pill">🏆 Savaş Puanı: ${n(bp)}</span><span class="pill">👑 Kazanan: ${result.winnerPlayerId?esc(result.winnerPlayerId):'Beraberlik'}</span>${tacticLabel?`<span class="pill">${tacticIcon} Taktik: ${esc(tacticLabel)}</span>`:''}</div><p class="muted">Saldıran kayıpları: ${losses(r.attacker_losses||result.attackerLosses)}</p><p class="muted">Savunan kayıpları: ${losses(r.defender_losses||result.defenderLosses)}</p><p>💰 Ganimet: Metal ${n((r.loot||result.loot)?.metal)} · Enerji ${n((r.loot||result.loot)?.energy)} · Su ${n((r.loot||result.loot)?.water)} · Kristal ${n((r.loot||result.loot)?.crystal)}</p>${(result.attackerBreakdown||result.defenderBreakdown)?`<div class=detail><b>⚔️ Birim savaş analizi</b><table class=unit-table><tr><th>Taraf</th><th>Birim</th><th>Seviye</th><th>Miktar</th><th>Avantaj</th><th>Güç</th></tr>${(result.attackerBreakdown||[]).map(x=>`<tr><td>Saldıran</td><td>${esc(x.unit_type)}</td><td>${n(x.level)}</td><td>${n(x.quantity)}</td><td>x${Number(x.matchupMultiplier||1).toFixed(3)}</td><td>${n(x.power)}</td></tr>`).join('')}${(result.defenderBreakdown||[]).map(x=>`<tr><td>Savunan</td><td>${esc(x.unit_type)}</td><td>${n(x.level)}</td><td>${n(x.quantity)}</td><td>x${Number(x.matchupMultiplier||1).toFixed(3)}</td><td>${n(x.power)}</td></tr>`).join('')}</table><p class=muted>🛡️ Yapı savunma bonusu: x${Number(result.defenseBonus||1).toFixed(2)} · ⚖️ Güç farkı oranı: %${(Number(result.advantageRatio||0)*100).toFixed(1)}</p></div>`:''}<small class="muted">${r.created_at?new Date(r.created_at).toLocaleString('tr-TR'):''}</small></div>`}function researchLabel(k){return({production:'Üretim',combat:'Savaş',defense:'Savunma',crystal:'Kristal',generalPower:'Genel Güç',unitAttack:'Birim Saldırı',unitDefense:'Birim Savunma',unitHp:'Birim Dayanıklılık',travelSpeed:'Seyahat Hızı'})[k]||k}function buildEspionage(r){const result=r.result&&typeof r.result==='object'?r.result:{};const detected=r.detected===true||result.detected===true||result.outcome==='detected';const resources=result.resources||null;const buildings=Array.isArray(result.buildings)?result.buildings:[];const army=Array.isArray(result.army)?result.army:[];const research=result.research&&typeof result.research==='object'?Object.entries(result.research):[];return `<div class="report"><div class="title ${detected?'loss':'spyTitle'}">${detected?'🚨 Casus Yakalandı':'🕵️ Casusluk Başarılı'}${detected?'':` — İstihbarat Sv.${n(result.intelLevel||0)}`}</div><div class="grid"><div class="box"><b>Hedef Oyuncu</b><br>${esc(r.defender_username||'Oyuncu')}</div><div class="box"><b>Mesafe</b><br>${Number(r.distance||0).toFixed(1)} km</div><div class="box">🕵️ Gönderen Gözcü Kulesi<br><b>Sv.${n(r.attacker_watchtower_level)}</b></div><div class="box">🔭 Hedef Gözcü Kulesi<br><b>Sv.${n(r.defender_watchtower_level)}</b></div></div><p>${esc(result.message||'Casusluk görevi tamamlandı.')}</p>${resources?`<div class="detail"><b>📦 Kaynaklar</b><div class="bar"><span class="pill">🔩 Metal: ${n(resources.metal)}</span><span class="pill">⚡ Enerji: ${n(resources.energy)}</span><span class="pill">💧 Su: ${n(resources.water)}</span><span class="pill">💎 Kristal: ${n(resources.crystal)}</span></div></div>`:''}${buildings.length?`<div class="detail"><b>🏗️ Binalar</b><p class="muted">${buildings.map(b=>`${esc(b.building||'Bina')}${Number(b.slot||1)===2?' II':''}: Sv.${n(b.level)}`).join(' · ')}</p></div>`:''}${army.length?`<div class="detail"><b>⚔️ Ordu</b><table class="unit-table"><tr><th>Birim</th><th>Seviye</th><th>Miktar</th></tr>${army.map(x=>`<tr><td>${esc(x.unitType||'Birim')}</td><td>${n(x.level||1)}</td><td>${n(x.quantity)}</td></tr>`).join('')}</table></div>`:''}${research.length?`<div class="detail"><b>🔬 Araştırmalar</b><p class="muted">${research.map(([k,v])=>`${esc(researchLabel(k))}: Sv.${n(v)}`).join(' · ')}</p></div>`:''}<small class="muted">${r.completed_at?new Date(r.completed_at).toLocaleString('tr-TR'):(r.created_at?new Date(r.created_at).toLocaleString('tr-TR'):'')}</small></div>`}let reportsLoadPromise=null;async function load(){if(reportsLoadPromise)return reportsLoadPromise;reportsLoadPromise=(async()=>{try{const r=await fetch('/api/auth?action=reports',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(r.status===401){clearInvalidSession();return}if(!r.ok||!d.success)throw new Error(d.message);const list=d.reports||[];const spies=d.espionageReports||[];battleCount.textContent=n(list.length);spyCount.textContent=n(spies.length);reports.innerHTML=list.length?list.map(build).join(''):'<div class="report">Henüz savaş raporu yok.</div>';espionageReports.innerHTML=spies.length?spies.map(buildEspionage).join(''):'<div class="report">Henüz casusluk raporu yok.</div>'}catch(e){battleCount.textContent='0';spyCount.textContent='0';reports.innerHTML=`<div class="report">${esc(e.message||'Raporlar alınamadı.')}</div>`;espionageReports.innerHTML=`<div class="report">${esc(e.message||'Casusluk raporları alınamadı.')}</div>`}})().finally(()=>{reportsLoadPromise=null});return reportsLoadPromise}load();setInterval(load,15000);</script></body></html>
