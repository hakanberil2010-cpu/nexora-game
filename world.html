<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA - Dünya Haritası</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050d18;
  color: #eaf4ff;
}

.topbar {
  height: 76px;
  background: #071526;
  border-bottom: 1px solid #173451;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
}

.logo {
  font-size: 30px;
  letter-spacing: 7px;
  color: #16b9ff;
  font-weight: bold;
}

.player {
  color: #8fc9ef;
}

.player span {
  color: #ffffff;
  font-weight: bold;
}

.container {
  max-width: 1250px;
  margin: 35px auto;
  padding: 0 25px;
}

h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  color: #78b9e6;
  margin-bottom: 25px;
}

.world {
  position: relative;
  width: 100%;
  height: 600px;
  overflow: hidden;
  border: 1px solid #1d5278;
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 25%, #164b38 0 12%, transparent 13%),
    radial-gradient(circle at 75% 20%, #315b39 0 14%, transparent 15%),
    radial-gradient(circle at 45% 70%, #51462c 0 15%, transparent 16%),
    radial-gradient(circle at 85% 75%, #344e6d 0 16%, transparent 17%),
    linear-gradient(135deg, #08213a, #071526 60%, #0b2635);
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
}

.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(100,180,220,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,180,220,0.08) 1px, transparent 1px);
  background-size: 50px 50px;
}

.region {
  position: absolute;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 2;
}

.desert {
  left: 10%;
  top: 18%;
  color: #e8d59b;
}

.forest {
  left: 42%;
  top: 12%;
  color: #75d695;
}

.ice {
  right: 9%;
  top: 17%;
  color: #9fe7ff;
}

.mountain {
  left: 30%;
  bottom: 17%;
  color: #c6b8a2;
}

.volcanic {
  right: 28%;
  bottom: 15%;
  color: #ff9b72;
}

.ocean {
  right: 5%;
  bottom: 45%;
  color: #62cfff;
}

#realPlayers {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.colony {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 105px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.colony:hover { .colony.selected {
  transform: translate(-50%, -50%) scale(1.15);
  filter: brightness(1.5);
  animation: selectedPulse 1.2s infinite;
}

@keyframes selectedPulse {
  0% {
    filter: brightness(1.2);
  }

  50% {
    filter: brightness(1.8);
  }

  100% {
    filter: brightness(1.2);
  }
}
  transform: translate(-50%, -50%) scale(1.08);
  filter: brightness(1.35);
}

.colony-icon {
  width: 48px;
  height: 48px;
  margin: auto;
  border-radius: 50%;
  background: #102d48;
  border: 2px solid #16b9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  box-shadow: 0 0 18px rgba(22,185,255,0.35);
}

.colony-name {
  margin-top: 7px;
  font-size: 12px;
  font-weight: bold;
  color: #ffffff;
  white-space: nowrap;
}

.you {
  z-index: 10;
}

.you .colony-icon {
  border-color: #58ff9b;
  box-shadow: 0 0 22px rgba(88,255,155,0.5);
}

.you .colony-name {
  color: #58ff9b;
}

.c1 {
  left: 25%;
  top: 35%;
  z-index: 10;
}

.info {
  position: relative;
z-index: 20;
  margin-top: 20px;
  padding: 20px;
  background: #091b2d;
  border: 1px solid #173e5d;
  border-radius: 14px;
  display: none;
}

.info h2 {
  margin-top: 0;
  color: #16b9ff;
}
.colony-details {
  display: flex;
  gap: 12px;
  margin: 15px 0;
  flex-wrap: wrap;
}

.detail-box {
  background: #0d2740;
  border: 1px solid #1b5278;
  border-radius: 10px;
  padding: 12px 16px;
  min-width: 150px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.detail-label {
  font-size: 11px;
  color: #7faecb;
  text-transform: uppercase;
}

.detail-value {
  font-size: 15px;
  font-weight: bold;
  color: #16b9ff;
}
.info p {
  color: #9cc6e2;
}

.attack {
  background: #e33b3b;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 20px;
  font-weight: bold;
  cursor: pointer;
}

.attack:hover {
  background: #ff4d4d;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #16b9ff;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">NEXORA</div>

  <div class="player">
    Oyuncu: <span id="playerName">Oyuncu</span>
  </div>
</div>

<div class="container">

  <h1>🗺️ Dünya Haritası</h1>

  <div class="subtitle">
    Galaksideki kolonileri keşfet, rakiplerini seç ve saldır.
  </div>

  <div class="world">

    <div class="grid"></div>

    <div class="region desert">🏜️ Çöl Bölgesi</div>
    <div class="region forest">🌲 Orman Bölgesi</div>
    <div class="region ice">❄️ Buz Bölgesi</div>
    <div class="region mountain">⛰️ Dağ Bölgesi</div>
    <div class="region volcanic">🌋 Volkanik Bölge</div>
    <div class="region ocean">🌊 Okyanus</div>

    <div class="colony you c1"
         onclick="selectColony('Senin Kolonin', true)">
      <div class="colony-icon">🏰</div>
      <div class="colony-name">Senin Kolonin</div>
    </div>

    <div id="realPlayers"></div>

  </div>

  <div class="info" id="info">

    <h2 id="selectedName">Koloni</h2>

    <div class="colony-details">

      <div class="detail-box">
        <span class="detail-label">📍 Koordinat</span>
        <span class="detail-value" id="selectedCoordinates">
          X:-- Y:--
        </span>
      </div>

      <div class="detail-box">
        <span class="detail-label">🌍 Bölge</span>
        <span class="detail-value" id="selectedRegion">
          -
        </span>
      </div>

    </div>

    <p id="selectedText"></p>

    <button
      class="attack"
      id="attackButton"
      onclick="attack()"
    >
      ⚔️ Saldır
    </button>

</div>
<script>
const savedUser = JSON.parse(
  localStorage.getItem("nexora_player") || "null"
);

if (savedUser && savedUser.username) {
  document.getElementById("playerName").textContent =
    savedUser.username;
}

let selectedPlayer = null;
let selectedPlayerId = null;

function selectColony(name, isMine, playerId = null) {

  const info = document.getElementById("info");
  const selectedName = document.getElementById("selectedName");
  const selectedText = document.getElementById("selectedText");
  const attackButton = document.getElementById("attackButton");

  info.style.display = "block";
  selectedName.textContent = name;

  if (isMine) {
document.getElementById("selectedCoordinates").textContent =
  "X:" + x + " Y:" + y;

document.getElementById("selectedRegion").textContent =
  regionName;
    selectedText.textContent =
      "Bu senin kolonin. Kendi kolonine saldıramazsın.";

    attackButton.style.display = "none";

    selectedPlayer = null;
    selectedPlayerId = null;

    return;
  }

  selectedPlayer = name;
  selectedPlayerId = playerId;

  const x = Math.floor(Math.random() * 100) + 1;
  const y = Math.floor(Math.random() * 100) + 1;

  const regions = [
    "Çöl Bölgesi",
    "Orman Bölgesi",
    "Buz Bölgesi",
    "Dağ Bölgesi",
    "Volkanik Bölge"
  ];

  const region =
    regions[Math.floor(Math.random() * regions.length)];

  selectedText.textContent =
    name +
    " kolonisini seçtin. " +
    "Koordinat: X:" +
    x +
    " Y:" +
    y +
    " | Bölge: " +
    region +
    ". Saldırı gönderebilirsin.";

  attackButton.style.display = "inline-block";
}

async function attack() {

  if (!selectedPlayerId) {
    return;
  }

  const token =
    localStorage.getItem("nexora_token");

  if (!token) {
    alert("Oturum bulunamadı.");
    return;
  }

  const attackButton =
    document.getElementById("attackButton");

  attackButton.disabled = true;
  attackButton.textContent = "⚔️ Saldırılıyor...";

  try {

    const response = await fetch(
      "/api/auth?action=attack",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          targetPlayerId: selectedPlayerId
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      alert(
        data.message ||
        "Saldırı gerçekleştirilemedi."
      );

      return;
    }

    alert(
      "⚔️ Savaş Sonucu: " + data.result +
      "\n\nSaldırı Gücü: " + data.attackPower +
      "\nSavunma Gücü: " + data.defensePower +
      "\n\nGanimet:" +
      "\nMetal: " + data.loot.metal +
      "\nEnerji: " + data.loot.energy +
      "\nSu: " + data.loot.water +
      "\nKristal: " + data.loot.crystal
    );

  } catch (error) {

    console.error(
      "Saldırı hatası:",
      error
    );

    alert(
      "Saldırı sırasında bir hata oluştu."
    );

  } finally {

    attackButton.disabled = false;
    attackButton.textContent = "⚔️ Saldır";
  }
}

function createPlayerColony(player, index) {

  const colony = document.createElement("div");

  const positions = [
    { left: "52%", top: "25%" },
    { left: "72%", top: "32%" },
    { left: "58%", top: "50%" },
    { left: "35%", top: "48%" },
    { left: "78%", top: "65%" },
    { left: "18%", top: "55%" },
    { left: "42%", top: "78%" },
    { left: "68%", top: "80%" }
  ];

  const position =
    positions[index % positions.length];

  colony.className = "colony";

  colony.style.left = position.left;
  colony.style.top = position.top;

  const isMine =
    savedUser &&
    Number(player.player_id) === Number(savedUser.id);

  if (isMine) {
    return;
  }

  colony.innerHTML =
    '<div class="colony-icon">🏠</div>' +
    '<div class="colony-name">' +
    escapeHtml(player.username) +
    '</div>';

  colony.addEventListener("click", function(event) {

    event.stopPropagation();

    const info =
      document.getElementById("info");

    const selectedName =
      document.getElementById("selectedName");

    const selectedText =
      document.getElementById("selectedText");

    const attackButton =
      document.getElementById("attackButton");
document.querySelectorAll(".colony.selected").forEach(function(colony) {
  colony.classList.remove("selected");
});

event.currentTarget.classList.add("selected");
    selectedPlayer = player.username;
    selectedPlayerId = player.player_id;

    selectedName.textContent =
      player.username;

    /*
      Koloninin haritadaki gerçek yüzdelik konumu
      X ve Y koordinatı olarak kullanılıyor.
    */
    const x =
      Math.round(parseFloat(colony.style.left));

    const y =
      Math.round(parseFloat(colony.style.top));

    /*
      Haritadaki bölge etiketlerinden en yakın olanı bul.
    */
    let regionName = "Bilinmeyen Bölge";

    const regions =
      document.querySelectorAll(".region");

    let closestDistance = Infinity;

    regions.forEach(function(region) {

      const rect =
        region.getBoundingClientRect();

      const world =
        document.querySelector(".world");

      if (!world) {
        return;
      }

      const worldRect =
        world.getBoundingClientRect();

      const centerX =
        ((rect.left + rect.width / 2 -
          worldRect.left) /
          worldRect.width) * 100;

      const centerY =
        ((rect.top + rect.height / 2 -
          worldRect.top) /
          worldRect.height) * 100;

      const distance =
        Math.sqrt(
          Math.pow(x - centerX, 2) +
          Math.pow(y - centerY, 2)
        );

      if (distance < closestDistance) {

        closestDistance = distance;

        regionName =
          region.textContent
            .replace("🏜️", "")
            .replace("🌲", "")
            .replace("❄️", "")
            .replace("⛰️", "")
            .replace("🌋", "")
            .replace("🌊", "")
            .trim();
      }
    });

    selectedText.textContent =
      player.username +
      " kolonisini seçtin. " +
      "Koordinat: X:" +
      x +
      " Y:" +
      y +
      " | Bölge: " +
      regionName +
      ". Saldırı gönderebilirsin.";

    attackButton.style.display =
      "inline-block";

    info.style.display =
      "block";

    setTimeout(function() {

      info.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }, 50);

  });

  return colony;
}
function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text || "Oyuncu";

  return div.innerHTML;
}

async function loadWorldPlayers() {

  const token =
    localStorage.getItem("nexora_token");

  if (!token) {
    return;
  }

  try {

    const response = await fetch(
      "/api/auth?action=world",
      {
        method: "POST",
        headers: {
          "Authorization":
            "Bearer " + token
        }
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      return;
    }

    console.log(
      "Dünya oyuncuları:",
      data.players
    );

    const playersContainer =
      document.getElementById("realPlayers");

    if (!playersContainer) {
      return;
    }

    playersContainer.innerHTML = "";

    const otherPlayers =
      (data.players || []).filter(function(player) {

        if (!savedUser) {
          return true;
        }

        return Number(player.player_id) !==
          Number(savedUser.id);
      });

    otherPlayers.forEach(function(player, index) {

  const colony =
    createPlayerColony(player, index);

  if (colony) {

    const mapPositions = [
      { x: 18, y: 22 },
      { x: 42, y: 18 },
      { x: 68, y: 25 },
      { x: 82, y: 42 },
      { x: 60, y: 58 },
      { x: 32, y: 64 },
      { x: 15, y: 48 },
      { x: 45, y: 40 },
      { x: 75, y: 70 },
      { x: 25, y: 78 }
    ];

    const position =
  mapPositions[
    Number(player.player_id) % mapPositions.length
  ];

    colony.style.left =
      position.x + "%";

    colony.style.top =
      position.y + "%";

    colony.style.position =
      "absolute";

    playersContainer.appendChild(
      colony
    );
  }
});

  } catch (error) {

    console.error(
      "Dünya haritası hatası:",
      error
    );
  }
}

loadWorldPlayers();
</script>

</body>
</html>
