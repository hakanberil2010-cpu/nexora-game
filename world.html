<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA - Dünya Haritası</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050d18;
  color: #eaf4ff;
}

.topbar {
  height: 76px;
  background: #071526;
  border-bottom: 1px solid #173451;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
}

.logo {
  font-size: 30px;
  letter-spacing: 7px;
  color: #16b9ff;
  font-weight: bold;
}

.player {
  color: #8fc9ef;
}

.player span {
  color: #ffffff;
  font-weight: bold;
}

.container {
  max-width: 1250px;
  margin: 35px auto;
  padding: 0 25px;
}

h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  color: #78b9e6;
  margin-bottom: 25px;
}

.world {
  position: relative;
  width: 100%;
  height: 600px;
  overflow: hidden;
  border: 1px solid #1d5278;
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 25%, #164b38 0 12%, transparent 13%),
    radial-gradient(circle at 75% 20%, #315b39 0 14%, transparent 15%),
    radial-gradient(circle at 45% 70%, #51462c 0 15%, transparent 16%),
    radial-gradient(circle at 85% 75%, #344e6d 0 16%, transparent 17%),
    linear-gradient(135deg, #08213a, #071526 60%, #0b2635);
  box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
}

.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(100,180,220,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,180,220,0.08) 1px, transparent 1px);
  background-size: 50px 50px;
}

.region {
  position: absolute;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 2;
}

.desert {
  left: 10%;
  top: 18%;
  color: #e8d59b;
}

.forest {
  left: 42%;
  top: 12%;
  color: #75d695;
}

.ice {
  right: 9%;
  top: 17%;
  color: #9fe7ff;
}

.mountain {
  left: 30%;
  bottom: 17%;
  color: #c6b8a2;
}

.volcanic {
  right: 28%;
  bottom: 15%;
  color: #ff9b72;
}

.ocean {
  right: 5%;
  bottom: 45%;
  color: #62cfff;
}
.move {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2d7dff;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.move-menu {
  margin-top: 12px;
  padding: 15px;
  border-radius: 10px;
  background: rgba(10, 20, 40, 0.95);
  border: 1px solid rgba(255,255,255,0.15);
}

.move-menu h3 {
  margin-top: 0;
  margin-bottom: 12px;
  font-size: 17px;
}

.move-menu button {
  width: 100%;
  margin-top: 8px;
  padding: 9px;
  border: none;
  border-radius: 7px;
  background: #1b2945;
  color: white;
  cursor: pointer;
  text-align: left;
}

.move-menu button:hover {
  background: #2d7dff;
}
#realPlayers {
  position: absolute;
  inset: 0;
  z-index: 5;
}
#attackFleet {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

.attack-fleet {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 28px;
  transition: left 1s linear, top 1s linear;
  filter: drop-shadow(0 0 8px rgba(255,220,80,0.8));
}
.colony {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 105px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.colony:hover {
  transform: translate(-50%, -50%) scale(1.08);
  filter: brightness(1.35);
}

.colony.selected {
  transform: translate(-50%, -50%) scale(1.15);
  filter: brightness(1.5);
  animation: selectedPulse 1.2s infinite;
  z-index: 20;
}

@keyframes selectedPulse {
  0% {
    filter: brightness(1.2);
  }

  50% {
    filter: brightness(1.8);
  }

  100% {
    filter: brightness(1.2);
  }
}

.colony-icon {
  width: 48px;
  height: 48px;
  margin: auto;
  border-radius: 50%;
  background: #102d48;
  border: 2px solid #16b9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  box-shadow: 0 0 18px rgba(22,185,255,0.35);
}

.colony-name {
  margin-top: 7px;
  font-size: 12px;
  font-weight: bold;
  color: #ffffff;
  white-space: nowrap;
}

.you {
  z-index: 10;
}

.you .colony-icon {
  border-color: #58ff9b;
  box-shadow: 0 0 22px rgba(88,255,155,0.5);
}

.you .colony-name {
  color: #58ff9b;
}

.c1 {
  left: 25%;
  top: 35%;
  z-index: 10;
}

.info {
  position: relative;
  z-index: 20;
  margin-top: 20px;
  padding: 20px;
  background: #091b2d;
  border: 1px solid #173e5d;
  border-radius: 14px;
  display: none;
}

.info h2 {
  margin-top: 0;
  color: #16b9ff;
}

.colony-details {
  display: flex;
  gap: 12px;
  margin: 15px 0;
  flex-wrap: wrap;
}

.detail-box {
  background: #0d2740;
  border: 1px solid #1b5278;
  border-radius: 10px;
  padding: 12px 16px;
  min-width: 170px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.detail-label {
  font-size: 11px;
  color: #7faecb;
  text-transform: uppercase;
}

.detail-value {
  font-size: 15px;
  font-weight: bold;
  color: #16b9ff;
}

.info p {
  color: #9cc6e2;
}

.attack {
  background: #e33b3b;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 20px;
  font-weight: bold;
  cursor: pointer;
}

.attack:hover {
  background: #ff4d4d;
}

.attack:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #16b9ff;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}

@media (max-width: 700px) {
  .topbar {
    padding: 0 15px;
  }

  .logo {
    font-size: 22px;
    letter-spacing: 4px;
  }

  .container {
    padding: 0 12px;
    margin-top: 20px;
  }

  .world {
    height: 500px;
  }

  .detail-box {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">NEXORA</div>

  <div class="player">
    Oyuncu: <span id="playerName">Oyuncu</span>
  </div>
</div>

<div class="container">

  <h1>🗺️ Dünya Haritası</h1>

  <div class="subtitle">
    Galaksideki kolonileri keşfet, rakiplerini seç ve saldır.
  </div>

  <div class="world">

    <div class="grid"></div>

    <div class="region desert">🏜️ Çöl Bölgesi</div>
    <div class="region forest">🌲 Orman Bölgesi</div>
    <div class="region ice">❄️ Buz Bölgesi</div>
    <div class="region mountain">⛰️ Dağ Bölgesi</div>
    <div class="region volcanic">🌋 Volkanik Bölge</div>
    <div class="region ocean">🌊 Okyanus</div>

    <div
      class="colony you c1"
      onclick="selectColony('Senin Kolonin', true, savedUser ? savedUser.id : null)"
    >
      <div class="colony-icon">🏰</div>
      <div class="colony-name">Senin Kolonin</div>
    </div>

    <div id="realPlayers"></div>
<div id="attackFleet"></div>
  </div>

  <div class="info" id="info">

    <h2 id="selectedName">Koloni</h2>

    <div class="colony-details">

      <div class="detail-box">
        <span class="detail-label">📍 Koordinat</span>
        <span class="detail-value" id="selectedCoordinates">
          X:-- Y:--
        </span>
      </div>

      <div class="detail-box">
        <span class="detail-label">🌍 Bölge</span>
        <span class="detail-value" id="selectedRegion">
          -
        </span>
      </div>

    </div>

    <p id="selectedText"></p>

    <button
      class="attack"
      id="attackButton"
      onclick="attack()"
    >
      ⚔️ Saldır
    </button>
    <button
      class="move"
      id="moveButton"
      onclick="openMoveMenu()"
    >
      🚚 Taşınma
    </button>

    <div
      id="moveMenu"
      class="move-menu"
      style="display:none;"
    >
      <h3>🚚 Koloni İşlemleri</h3>

      <button onclick="showCoordinates()">
        📍 Koordinat Bilgisi
      </button>

      <button onclick="copyCoordinates()">
        📋 Koordinatı Kopyala
      </button>

      <button onclick="shareCoordinates()">
        📤 Koordinatı Paylaş
      </button>

      <button onclick="moveColony()">
        🚚 Koloniyi Taşı
      </button>

      <button onclick="changeCoordinates()">
        🧭 Koordinat Değiştir
      </button>

      <button onclick="closeMoveMenu()">
        ❌ Kapat
      </button>
    </div>
  </div>

  <a class="back" href="game.html">
    ← Koloniye Dön
  </a>

</div>

<script>
  function openMoveMenu() {
  const menu = document.getElementById("moveMenu");

  if (menu) {
    menu.style.display = "block";
  }
}

function closeMoveMenu() {
  const menu = document.getElementById("moveMenu");

  if (menu) {
    menu.style.display = "none";
  }
}
  function showCoordinates() {
  const coordinates =
    document.getElementById("selectedCoordinates").textContent;

  alert("📍 Koloni Koordinatı\n\n" + coordinates.trim());
}
function copyCoordinates() {
  const coordinates =
    document.getElementById("selectedCoordinates").textContent.trim();

  navigator.clipboard.writeText(coordinates)
    .then(function() {
      alert("✅ Koordinat kopyalandı:\n\n" + coordinates);
    })
    .catch(function() {
      alert("❌ Koordinat kopyalanamadı.");
    });
} 
  function shareCoordinates() {
  const coordinates =
    document.getElementById("selectedCoordinates").textContent.trim();

  if (navigator.share) {
    navigator.share({
      title: "NEXORA Koloni Koordinatı",
      text: "📍 Koloni koordinatı: " + coordinates
    });
  } else {
    navigator.clipboard.writeText(
      "📍 NEXORA Koloni Koordinatı: " + coordinates
    );

    alert(
      "📋 Paylaşım desteklenmiyor.\n\nKoordinat panoya kopyalandı:\n" +
      coordinates
    );
  }
}
  function moveColony() {
  alert(
    "🚚 Koloni Taşıma\n\n" +
    "Bu özellik hazırlanıyor.\n\n" +
    "Buradan ileride yeni koordinat seçerek " +
    "kolonini haritada başka bir konuma taşıyabileceksin."
  );
}
  function changeCoordinates() {
  const newX = prompt("Yeni X koordinatını gir:");
  const newY = prompt("Yeni Y koordinatını gir:");

  if (newX === null || newY === null) {
    return;
  }

  if (
    newX === "" ||
    newY === "" ||
    isNaN(newX) ||
    isNaN(newY)
  ) {
    alert("❌ Geçerli koordinat girin.");
    return;
  }

  alert(
    "📍 Yeni koordinat:\n\nX:" +
    newX +
    " Y:" +
    newY +
    "\n\nTaşınma sistemi henüz aktif değil."
  );
}
const savedUser = JSON.parse(
  localStorage.getItem("nexora_player") || "null"
);

if (savedUser && savedUser.username) {
  document.getElementById("playerName").textContent =
    savedUser.username;
}

let selectedPlayer = null;
let selectedPlayerId = null;

/*
  Haritadaki sabit konumlar.
  Oyuncu ID'sine göre seçildiği için
  aynı oyuncu aynı koordinatta kalır.
*/
const mapPositions = [
  { x: 18, y: 22 },
  { x: 42, y: 18 },
  { x: 68, y: 25 },
  { x: 82, y: 42 },
  { x: 60, y: 58 },
  { x: 32, y: 64 },
  { x: 15, y: 48 },
  { x: 45, y: 40 },
  { x: 75, y: 70 },
  { x: 25, y: 78 }
];

/*
  Koordinata göre bölge belirler.
  Böylece seçildiğinde kutudaki bölge
  ile haritadaki konum aynı kalır.
*/
function getRegionName(x, y) {

  const regionCenters = [
    {
      name: "Çöl Bölgesi",
      x: 10,
      y: 18
    },
    {
      name: "Orman Bölgesi",
      x: 42,
      y: 12
    },
    {
      name: "Buz Bölgesi",
      x: 91,
      y: 17
    },
    {
      name: "Dağ Bölgesi",
      x: 30,
      y: 83
    },
    {
      name: "Volkanik Bölge",
      x: 72,
      y: 85
    },
    {
      name: "Okyanus",
      x: 95,
      y: 55
    }
  ];

  let closest = regionCenters[0];
  let closestDistance = Infinity;

  regionCenters.forEach(function(region) {

    const distance = Math.sqrt(
      Math.pow(x - region.x, 2) +
      Math.pow(y - region.y, 2)
    );

    if (distance < closestDistance) {
      closestDistance = distance;
      closest = region;
    }
  });

  return closest.name;
}

function updateSelectedInfo(name, x, y, regionName) {

  const selectedName =
    document.getElementById("selectedName");

  const selectedText =
    document.getElementById("selectedText");

  const selectedCoordinates =
    document.getElementById("selectedCoordinates");

  const selectedRegion =
    document.getElementById("selectedRegion");

  selectedName.textContent = name;

  selectedCoordinates.textContent =
    "X:" + x + " Y:" + y;

  selectedRegion.textContent =
    regionName;

  selectedText.textContent =
    name +
    " kolonisini seçtin. " +
    "Koordinat: X:" +
    x +
    " Y:" +
    y +
    " | Bölge: " +
    regionName +
    ". Saldırı gönderebilirsin.";
}

function selectColony(name, isMine, playerId = null) {

  const info =
    document.getElementById("info");

  const attackButton =
    document.getElementById("attackButton");

  info.style.display = "block";

  document.querySelectorAll(
    ".colony.selected"
  ).forEach(function(colony) {
    colony.classList.remove("selected");
  });

  if (isMine) {

    document.getElementById(
      "selectedName"
    ).textContent = name;

    document.getElementById(
      "selectedCoordinates"
    ).textContent = "X:25 Y:35";

    document.getElementById(
      "selectedRegion"
    ).textContent =
      getRegionName(25, 35);

    document.getElementById(
      "selectedText"
    ).textContent =
      "Bu senin kolonin. Kendi kolonine saldıramazsın.";

    attackButton.style.display =
      "none";

    selectedPlayer = null;
    selectedPlayerId = null;

    return;
  }

  selectedPlayer = name;
  selectedPlayerId = playerId;

  updateSelectedInfo(
    name,
    0,
    0,
    "Bilinmeyen Bölge"
  );

  attackButton.style.display =
    "inline-block";
}

function selectPlayerColony(
  colony,
  player,
  x,
  y
) {

  document.querySelectorAll(
    ".colony.selected"
  ).forEach(function(item) {
    item.classList.remove("selected");
  });

  colony.classList.add("selected");

  selectedPlayer =
    player.username;

  selectedPlayerId =
    player.player_id;

  const regionName =
    getRegionName(x, y);

  /* Senin koloninin koordinatı */
  const myX = 25;
  const myY = 35;

  /* İki koloni arasındaki mesafe */
  const distance = Math.sqrt(
    Math.pow(x - myX, 2) +
    Math.pow(y - myY, 2)
  );

  const roundedDistance =
    Math.round(distance);

  updateSelectedInfo(
    player.username,
    x,
    y,
    regionName
  );

  /* Mesafe bilgisini açıklamaya ekle */
  document.getElementById(
    "selectedText"
  ).textContent =
    player.username +
    " kolonisini seçtin. " +
    "Koordinat: X:" +
    x +
    " Y:" +
    y +
    " | Bölge: " +
    regionName +
    " | 📏 Mesafe: " +
    roundedDistance +
    " km. " +
    "Saldırı gönderebilirsin.";

  document.getElementById(
    "attackButton"
  ).style.display =
    "inline-block";

  document.getElementById(
    "info"
  ).style.display =
    "block";

  setTimeout(function() {

    document.getElementById(
      "info"
    ).scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }, 50);
}
  async function attack() {

  if (!selectedPlayerId) {
    return;
  }

  const token =
    localStorage.getItem("nexora_token");

  if (!token) {
    alert("Oturum bulunamadı.");
    return;
  }

  const attackButton =
    document.getElementById("attackButton");

  const fleetContainer =
    document.getElementById("attackFleet");

  /*
    Hedef koordinatı
  */
  const targetPosition =
    mapPositions[
      Number(selectedPlayerId) %
      mapPositions.length
    ];

  const targetX =
    targetPosition.x;

  const targetY =
    targetPosition.y;

  /*
    Senin koloninin koordinatı
  */
  const myX = 25;
  const myY = 35;

  /*
    Mesafe
  */
  const distance =
    Math.sqrt(
      Math.pow(targetX - myX, 2) +
      Math.pow(targetY - myY, 2)
    );

  /*
    Saldırı süresi
  */
  const attackTime =
    Math.max(5, Math.round(distance));

  /*
    Eski filoyu temizle
  */
  if (fleetContainer) {
    fleetContainer.innerHTML = "";
  }

  /*
    Yeni filo oluştur
  */
  const fleet =
    document.createElement("div");

  fleet.className =
    "attack-fleet";

  fleet.textContent =
    "🚀";

  fleet.style.left =
    myX + "%";

  fleet.style.top =
    myY + "%";

  /*
    Filo, saldırı süresi boyunca
    hedefe doğru hareket eder.
  */
  fleet.style.transition =
    "left " + attackTime + "s linear, " +
    "top " + attackTime + "s linear";

  if (fleetContainer) {
    fleetContainer.appendChild(fleet);
  }

  /*
    Hareketi başlat
  */
  setTimeout(function() {

    fleet.style.left =
      targetX + "%";

    fleet.style.top =
      targetY + "%";

  }, 50);

  attackButton.disabled = true;

  /*
    Geri sayım
  */
  for (
    let remaining = attackTime;
    remaining > 0;
    remaining--
  ) {

    attackButton.textContent =
      "⚔️ Saldırılıyor... " +
      remaining +
      " sn";

    await new Promise(function(resolve) {
      setTimeout(resolve, 1000);
    });
  }

  attackButton.textContent =
    "⚔️ Saldırı gönderiliyor...";

  try {

    const response =
      await fetch(
        "/api/auth?action=attack",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              "Bearer " + token
          },

          body: JSON.stringify({
            targetPlayerId:
              selectedPlayerId
          })
        }
      );

    const data =
      await response.json();

    /*
      Savaş tamamlandıktan sonra
      filoyu haritadan kaldır.
    */
    if (fleet) {
      fleet.remove();
    }

    if (!response.ok || !data.success) {

      alert(
        data.message ||
        "Saldırı gerçekleştirilemedi."
      );

      return;
    }

    const loot =
      data.loot || {};

    alert(
      "⚔️ Savaş Sonucu: " +
      data.result +
      "\n\nSaldırı Gücü: " +
      data.attackPower +
      "\nSavunma Gücü: " +
      data.defensePower +
      "\n\nGanimet:" +
      "\nMetal: " +
      (loot.metal || 0) +
      "\nEnerji: " +
      (loot.energy || 0) +
      "\nSu: " +
      (loot.water || 0) +
      "\nKristal: " +
      (loot.crystal || 0)
    );

  } catch (error) {

    if (fleet) {
      fleet.remove();
    }

    console.error(
      "Saldırı hatası:",
      error
    );

    alert(
      "Saldırı sırasında bir hata oluştu."
    );

  } finally {

    attackButton.disabled = false;

    attackButton.textContent =
      "⚔️ Saldır";
  }
}
function createPlayerColony(
  player,
  index
) {
  const colony =
    document.createElement("div");

  /*
    Öncelik veritabanındaki kayıtlı koordinatlar.
    Eski oyuncularda koordinat yoksa
    mevcut mapPositions sistemi kullanılır.
  */
  let x = Number(player.coordinate_x);
  let y = Number(player.coordinate_y);

  if (
    !Number.isFinite(x) ||
    !Number.isFinite(y)
  ) {
    const position =
      mapPositions[
        Number(player.player_id) %
        mapPositions.length
      ];

    x = position.x;
    y = position.y;
  }

  colony.className = "colony";

  colony.style.left =
    x + "%";

  colony.style.top =
    y + "%";

  colony.style.position =
    "absolute";

  const isMine =
    savedUser &&
    Number(player.player_id) ===
    Number(savedUser.id);

  if (isMine) {
    return null;
  }

  colony.innerHTML =
    '<div class="colony-icon">🏠</div>' +
    '<div class="colony-name">' +
    escapeHtml(player.username) +
    '</div>';

  colony.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      selectPlayerColony(
        colony,
        player,
        x,
        y
      );
    }
  );

  return colony;
}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "Oyuncu";

  return div.innerHTML;
}

async function loadWorldPlayers() {

  const token =
    localStorage.getItem(
      "nexora_token"
    );

  if (!token) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/auth?action=world",
        {
          method: "POST",

          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );

    const data =
      await response.json();
const fleet =
  document.querySelector("#attackFleet .attack-fleet");

    if (
      !response.ok ||
      !data.success
    ) {
      return;
    }

    console.log(
      "Dünya oyuncuları:",
      data.players
    );

    const playersContainer =
      document.getElementById(
        "realPlayers"
      );

    if (!playersContainer) {
      return;
    }

    playersContainer.innerHTML =
      "";

    const otherPlayers =
      (data.players || [])
      .filter(function(player) {

        if (!savedUser) {
          return true;
        }

        return Number(
          player.player_id
        ) !== Number(
          savedUser.id
        );
      });

    otherPlayers.forEach(
      function(player, index) {

        const colony =
          createPlayerColony(
            player,
            index
          );

        if (colony) {

          playersContainer.appendChild(
            colony
          );
        }
      }
    );

  } catch (error) {

    console.error(
      "Dünya haritası hatası:",
      error
    );
  }
}

loadWorldPlayers();
