<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NEXORA - İttifak</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}.container{max-width:1100px;margin:30px auto;padding:0 20px}.panel{background:#091a2c;border:1px solid #173b5d;border-radius:14px;padding:20px;margin:16px 0}.input{width:100%;padding:11px;margin:7px 0 12px;background:#071526;border:1px solid #285476;border-radius:8px;color:#fff}.button{padding:11px 16px;border:0;border-radius:8px;background:#128fcb;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#a63333}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;background:#071526;border:1px solid #17344f;border-radius:9px;margin:9px 0}.muted{color:#8db0cf}.hidden{display:none}.back{color:#18bfff;text-decoration:none}.topBack{display:inline-block;margin:0 0 18px;padding:10px 16px;border-radius:8px;background:#138dcc;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #1aa9ee}.topBack:hover{filter:brightness(1.08)}</style></head><body><div class="top"><div class="logo">NEXORA</div><div>Oyuncu: <strong id="player">Oyuncu</strong></div></div><div class="container"><a class="topBack" href="game.html">← Koloniye Dön</a><h1>🤝 İttifak</h1><p class="muted">Oyuncularla birleş, ittifak gücünü yükselt ve birlikte ilerle.</p><div id="msg" class="panel"></div><div id="create" class="panel"><h2>🏛️ İttifak Oluştur</h2><input class="input" id="name" maxlength="30" placeholder="İttifak adı"><input class="input" id="tag" maxlength="5" placeholder="Etiket (2-5 karakter)"><button class="button" onclick="createAlliance()">İttifak Oluştur</button></div><div id="mine" class="panel hidden"><h2 id="myTitle"></h2><div id="myStats" class="muted"></div><div id="members"></div><button class="button danger" onclick="leaveAlliance()">İttifaktan Ayrıl</button></div><div class="panel"><h2>🌌 İttifaklar</h2><div id="list">Yükleniyor...</div></div><a class="back" href="game.html">← Koloniye Dön</a></div><script>const token=localStorage.getItem('nexora_token');const u=JSON.parse(localStorage.getItem('nexora_player')||'null');if(!token)location.href='login.html';if(u?.username)player.textContent=u.username;const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};function msg(t){document.getElementById('msg').textContent=t}async function kickMember(playerId){if(!confirm('Bu oyuncuyu ittifaktan çıkarmak istiyor musun?'))return;const r=await fetch('/api/auth?action=kickalliance',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({playerId:Number(playerId)})});const d=await r.json();msg(d.message||'');if(r.ok&&d.success)loadMine()}function showMine(a,m,members){create.classList.add('hidden');mine.classList.remove('hidden');myTitle.innerHTML=esc(a.name)+' <small>['+esc(a.tag)+']</small>';myStats.textContent='Rol: '+(m?.role==='leader'?'👑 Lider':'🛡️ Üye')+' · Üye: '+(members||[]).length+' · İttifak gücü: '+Number(a.alliance_power||0).toLocaleString('tr-TR');membersEl=document.getElementById('members');membersEl.innerHTML=(members||[]).map(x=>`<div class="item"><span><b>${esc(x.username)}</b><br><small class="muted">${x.role==='leader'?'👑 Lider':'🛡️ Üye'}</small></span>${m?.role==='leader'&&Number(x.player_id)!==Number(m.player_id)?`<button class="button danger" onclick="kickMember(${Number(x.player_id)})">Çıkar</button>`:''}</div>`).join('')}async function loadMine(){const r=await fetch('/api/auth?action=myalliance',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.success&&d.alliance)showMine(d.alliance,d.member,d.members)}async function createAlliance(){const name=document.getElementById('name').value.trim(),tag=document.getElementById('tag').value.trim();const r=await fetch('/api/auth?action=createalliance',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name,tag})});const d=await r.json();msg(d.message||'');if(r.ok&&d.success){loadMine();loadAll()}}async function loadAll(){const r=await fetch('/api/auth?action=alliances',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!d.success){list.textContent=d.message||'İttifaklar alınamadı';return}list.innerHTML=(d.alliances||[]).map(a=>`<div class="item"><div><b>${esc(a.name)} [${esc(a.tag)}]</b><br><small class="muted">${Number(a.member_count||0)} üye · Güç ${Number(a.alliance_power||0).toLocaleString('tr-TR')}</small></div><button class="button" onclick="joinAlliance(${Number(a.id)})">Katıl</button></div>`).join('')||'Henüz ittifak yok.'}async function joinAlliance(id){const r=await fetch('/api/auth?action=joinalliance',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({allianceId:id})});const d=await r.json();msg(d.message||'');if(r.ok&&d.success){loadMine();loadAll()}}async function leaveAlliance(){if(!confirm('İttifaktan ayrılmak istediğine emin misin?'))return;const r=await fetch('/api/auth?action=leavealliance',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();msg(d.message||'');if(r.ok&&d.success){mine.classList.add('hidden');create.classList.remove('hidden');loadAll()}}loadAll();loadMine();</script></body></html>
