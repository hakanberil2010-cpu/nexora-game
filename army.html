<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERYNDIS - Ordu</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}
.topbar{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}
.player{color:#9fc0df}
.container{max-width:1250px;margin:30px auto;padding:0 20px}
h1{margin-bottom:6px}
.sub{color:#7196b8}
.resources,.statsbar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}
.res,.stat{background:#091a2c;border:1px solid #173b5d;border-radius:10px;padding:12px}
.stat b{display:block;font-size:18px}
.army-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#091a2c;border:1px solid #173b5d;border-radius:12px;padding:20px}
.icon{font-size:40px}
.level{color:#18bfff;font-weight:bold;margin:8px 0}
.qty{font-size:28px;font-weight:bold;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:#071526;border:1px solid #16344f;border-radius:8px;padding:9px}
.stats small{display:block;color:#7196b8}
.cost{color:#8db0cf;margin:14px 0}

.trainBox{
  background:#071526;
  border:1px solid #17344f;
  border-radius:10px;
  padding:12px;
  margin:14px 0 10px
}

.trainTitle{
  color:#9fc0df;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px
}

.quantityRow{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px
}

.quantityInput{
  grid-column:1/-1;
}

.quantityInput{
  width:100%;
  min-width:0;
  padding:10px;
  border-radius:7px;
  border:1px solid #245276;
  background:#050d18;
  color:#fff;
  font-weight:bold;
  outline:none
}

.quantityInput:focus{
  border-color:#18bfff
}

.quick{
  border:1px solid #245276;
  border-radius:7px;
  background:#102e49;
  color:#8bdcff;
  font-weight:bold;
  cursor:pointer
}

.quick:hover{
  background:#174467
}

.selectionCost{
  min-height:34px;
  color:#8db0cf;
  font-size:12px;
  line-height:1.45;
  margin-top:8px
}

.button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#128fcb;
  color:white;
  font-weight:bold;
  cursor:pointer
}

.button:hover:not(:disabled){
  background:#18bfff
}

.maxButton{
  margin-top:8px;
  background:#7357c8
}

.maxButton:hover:not(:disabled){
  background:#8b6df0
}

.upgrade{
  margin-top:8px;
  background:#1b8f59
}

.upgrade:hover:not(:disabled){
  background:#24ad6e
}

.upgrade:disabled,
.button:disabled,
.quick:disabled{
  opacity:.45;
  cursor:not-allowed
}

.queue{
  background:#091a2c;
  border:1px solid #173b5d;
  border-radius:12px;
  padding:18px;
  margin:20px 0
}

.qitem{
  padding:10px;
  border-bottom:1px solid #17344f
}

.qitem:last-child{
  border-bottom:0
}

.time{
  color:#18bfff;
  font-weight:bold
}

.topBack{
  display:inline-block;
  margin:0 0 18px;
  padding:10px 16px;
  border-radius:8px;
  background:#138dcc;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  border:1px solid #1aa9ee
}

.topBack:hover{
  filter:brightness(1.08)
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#18bfff;
  text-decoration:none
}

@media(max-width:900px){
  .resources,.statsbar{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){
  .topbar{
    height:auto;
    min-height:70px;
    padding:12px 14px;
    gap:10px;
    flex-wrap:wrap
  }
  .logo{
    font-size:24px;
    letter-spacing:4px
  }
  .player{
    font-size:13px;
    overflow-wrap:anywhere
  }
  .container{
    margin:20px auto;
    padding:0 12px
  }
}

/* Army Command Center Visual Pass */
:root{
  --army-panel:#081827;
  --army-panel-2:#0b2033;
  --army-border:rgba(73,159,199,.30);
  --army-cyan:#69ddff;
  --army-text:#eaf7ff;
  --army-muted:#8eb1c7;
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 18% 0%,rgba(23,119,159,.13),transparent 32%),
    radial-gradient(circle at 88% 18%,rgba(86,77,190,.10),transparent 30%),
    linear-gradient(180deg,#04101a 0%,#06131f 44%,#040b12 100%);
}
.topbar{
  height:78px;
  position:sticky;
  top:0;
  z-index:20;
  background:
    linear-gradient(180deg,rgba(8,29,46,.97),rgba(5,20,33,.96));
  border-bottom:1px solid rgba(83,182,220,.26);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}
.logo{
  color:#72e4ff;
  text-shadow:0 0 18px rgba(74,205,244,.38);
}
.player{
  padding:7px 11px;
  border:1px solid rgba(91,174,210,.20);
  border-radius:999px;
  background:rgba(4,17,29,.72);
}
.container{
  max-width:1320px;
  margin:28px auto 44px;
}
.container>h1{
  margin:4px 0 4px;
  font-size:clamp(28px,3vw,40px);
  letter-spacing:.3px;
  text-shadow:0 0 24px rgba(67,187,232,.16);
}
.sub{
  max-width:820px;
  color:#90afc3;
  line-height:1.55;
}
.topBack{
  border-color:rgba(93,200,238,.42);
  background:
    linear-gradient(180deg,rgba(20,112,154,.92),rgba(11,75,112,.94));
  box-shadow:0 7px 18px rgba(0,0,0,.22),0 0 16px rgba(56,190,237,.10);
}
.resources{
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  margin:22px 0 16px;
}
.res{
  position:relative;
  min-height:74px;
  overflow:hidden;
  padding:12px 13px;
  border:1px solid var(--army-border);
  border-radius:12px;
  background:
    radial-gradient(circle at 100% 0%,rgba(79,194,230,.10),transparent 48%),
    linear-gradient(180deg,rgba(11,34,52,.96),rgba(6,23,37,.96));
  color:#93b5c9;
  font-size:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.025);
}
.res::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:8px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,rgba(92,219,255,.70),rgba(92,219,255,0));
  opacity:.42;
}
.res b{
  display:block;
  margin-top:6px;
  color:#f0fbff;
  font-size:18px;
  letter-spacing:.2px;
}
.queue{
  position:relative;
  overflow:hidden;
  margin:16px 0 22px;
  padding:16px 18px;
  border:1px solid rgba(95,190,225,.28);
  background:
    radial-gradient(circle at 0% 0%,rgba(76,189,229,.10),transparent 34%),
    linear-gradient(180deg,rgba(9,31,48,.96),rgba(6,21,34,.96));
  box-shadow:0 12px 26px rgba(0,0,0,.22);
}
.queue::before{
  content:"OPERASYON HATTI";
  position:absolute;
  top:12px;
  right:14px;
  color:rgba(109,218,249,.55);
  font-size:9px;
  font-weight:800;
  letter-spacing:1.8px;
}
.queue h3{
  margin:0 0 12px;
  color:#dff8ff;
  font-size:16px;
}
#queueList{
  display:grid;
  gap:7px;
  color:#91afc2;
}
.qitem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:40px;
  padding:9px 11px;
  border:1px solid rgba(73,146,179,.20);
  border-radius:8px;
  background:rgba(3,16,27,.66);
}
.time{
  flex-shrink:0;
  color:#75e0ff;
  font-size:13px;
  text-shadow:0 0 10px rgba(74,206,243,.25);
}
.army-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.card{
  --unit-accent:#62d9ff;
  --unit-glow:rgba(72,202,242,.24);
  position:relative;
  overflow:hidden;
  min-height:100%;
  padding:18px;
  border:1px solid color-mix(in srgb,var(--unit-accent) 34%,transparent);
  border-radius:14px;
  background:
    radial-gradient(circle at 12% 0%,var(--unit-glow),transparent 30%),
    linear-gradient(180deg,rgba(10,31,48,.98),rgba(6,20,32,.98));
  box-shadow:
    0 13px 28px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);
}
.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--unit-accent);
  box-shadow:0 0 14px var(--unit-accent);
  opacity:.82;
}
.card[data-unit-type="piyade"]{
  --unit-accent:#77dcff;
  --unit-glow:rgba(83,191,232,.18);
}
.card[data-unit-type="savunma"]{
  --unit-accent:#79efb6;
  --unit-glow:rgba(94,225,165,.16);
}
.card[data-unit-type="saldiri"]{
  --unit-accent:#ff8c72;
  --unit-glow:rgba(255,104,76,.17);
}
.card[data-unit-type="okcu"]{
  --unit-accent:#e8bf69;
  --unit-glow:rgba(222,174,76,.16);
}
.card[data-unit-type="tank"]{
  --unit-accent:#b798ff;
  --unit-glow:rgba(163,120,246,.17);
}
.card[data-unit-type="hava"]{
  --unit-accent:#79d9ff;
  --unit-glow:rgba(93,206,246,.17);
}
.icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:8px;
  border:1px solid color-mix(in srgb,var(--unit-accent) 45%,transparent);
  border-radius:12px;
  background:rgba(3,18,29,.72);
  box-shadow:0 0 18px var(--unit-glow);
  font-size:30px;
}
.card h2{
  margin:3px 0 0;
  color:#f3fbff;
  font-size:21px;
}
.level{
  display:inline-flex;
  margin:8px 0 7px;
  padding:4px 8px;
  border:1px solid color-mix(in srgb,var(--unit-accent) 42%,transparent);
  border-radius:999px;
  background:rgba(3,17,28,.72);
  color:var(--unit-accent);
  font-size:11px;
  letter-spacing:.4px;
}
.qty{
  margin:5px 0 6px;
  color:#fff;
  font-size:26px;
  line-height:1.15;
}
.unit-role{
  min-height:34px;
  margin:0 0 12px;
  color:#87a9bd;
  font-size:12px;
  line-height:1.45;
}
.stats{
  gap:7px;
}
.stats div{
  padding:9px 10px;
  border-color:rgba(83,151,184,.20);
  background:rgba(3,16,27,.72);
}
.stats small{
  color:#789bb1;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.stats b{
  display:block;
  margin-top:3px;
  color:#eaf9ff;
  font-size:16px;
}
.cost{
  min-height:42px;
  margin:12px 0 10px;
  color:#9db9c9;
  font-size:12px;
  line-height:1.5;
}
.trainBox{
  margin:10px 0;
  padding:11px;
  border-color:rgba(83,160,194,.24);
  background:rgba(3,16,27,.76);
}
.trainTitle{
  margin-bottom:7px;
  color:#bed5e1;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.7px;
}
.quantityRow{
  gap:6px;
}
.quantityInput{
  height:40px;
  border-color:rgba(93,176,211,.34);
  background:#04111c;
  color:#effbff;
}
.quantityInput:focus{
  border-color:var(--unit-accent);
  box-shadow:0 0 0 2px var(--unit-glow);
}
.quick{
  min-height:34px;
  border-color:rgba(91,174,210,.30);
  background:rgba(12,53,77,.86);
  color:#9ee9ff;
}
.selectionCost{
  min-height:38px;
  margin-top:8px;
  color:#93b2c4;
}
.button{
  min-height:42px;
  border:1px solid rgba(104,205,242,.30);
  background:linear-gradient(180deg,#168fc3,#0d6f9e);
  box-shadow:0 6px 14px rgba(0,0,0,.18);
}
.maxButton{
  border-color:rgba(179,146,255,.34);
  background:linear-gradient(180deg,#765cc7,#5943a4);
}
.upgrade{
  border-color:rgba(102,232,171,.34);
  background:linear-gradient(180deg,#229763,#176c49);
}
.button:hover:not(:disabled),
.quick:hover:not(:disabled){
  transform:translateY(-1px);
  filter:brightness(1.08);
}
.button,
.quick{
  transition:transform .14s ease,filter .14s ease,border-color .14s ease;
}
@media(max-width:1080px){
  .resources{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .army-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:700px){
  .resources{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .army-grid{
    grid-template-columns:1fr;
  }
  .card{
    padding:15px;
  }
  .queue::before{
    display:none;
  }
}
@media(max-width:430px){
  .resources{
    gap:7px;
  }
  .res{
    min-height:66px;
    padding:10px;
  }
  .res b{
    font-size:16px;
  }
  .quantityRow{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .quantityInput{
    grid-column:1/-1;
  }
}
@media(prefers-reduced-motion:reduce){
  .button,
  .quick{
    transition:none;
  }
}

</style>
</head>

<body>

<div class="topbar">
  <div class="logo">TERYNDIS</div>

  <div class="player">
    Oyuncu:
    <strong id="playerName">Oyuncu</strong>
  </div>
</div>

<div class="container">

  <a class="topBack" href="game.html">
    ← Koloniye Dön
  </a>

  <h1>⚔️ Ordu</h1>

  <div class="sub">
    Birlik seviyeleri, özel birlik rolleri ve araştırmalar gerçek savaş hesaplamalarında kullanılır.
  </div>

  <div class="resources">

    <div class="res">
      ⛏️ Metal:
      <b id="metal">0</b>
    </div>

    <div class="res">
      ⚡ Enerji:
      <b id="energy">0</b>
    </div>

    <div class="res">
      🧱 Alaşım:
      <b id="alloy">0</b>
    </div>

    <div class="res">
      💎 Kristal:
      <b id="crystal">0</b>
    </div>

    <div class="res">
      👥 Nüfus:
      <b id="population">0/0</b>
    </div>

    <div class="res">
      ⚔️ Aktif Ordu:
      <b id="armyCount">0</b>
    </div>

  </div>

  <div class="queue">
    <h3>🏭 Üretim Kuyruğu</h3>
    <div id="queueList">
      Kuyruk boş.
    </div>
  </div>

  <div
    class="army-grid"
    id="armyGrid"
  ></div>

</div>

<script>

const token=
  localStorage.getItem(
    'nexora_token'
  );

const user=
  JSON.parse(
    localStorage.getItem(
      'nexora_player'
    )||'null'
  );


if(!token){
  location.href='login.html';
}


function clearInvalidSession(){

  localStorage.removeItem(
    'nexora_token'
  );

  localStorage.removeItem(
    'nexora_player'
  );

  location.href=
    'login.html';

}


if(user?.username){

  document.getElementById(
    'playerName'
  ).textContent=
    user.username;

}


const defaults={

  piyade:[
    '🪖',
    'Piyade',
    85,
    0,
    30,
    1,
    'Dengeli temel birlik'
  ],

  savunma:[
    '🛡️',
    'Savunma Birliği',
    130,
    0,
    60,
    1,
    'Savunma uzmanı • daha az kayıp'
  ],

  saldiri:[
    '🚀',
    'Saldırı Birliği',
    170,
    0,
    110,
    1,
    'Yüksek saldırı • daha kırılgan'
  ],

  okcu:[
    '🏹',
    'Okçu',
    190,
    0,
    135,
    1,
    'Menzilli saldırı • yüksek saldırı'
  ],

  tank:[
    '🛡️',
    'Tank',
    600,
    275,
    0,
    3,
    'Ağır birlik • yüksek dayanıklılık'
  ],

  hava:[
    '✈️',
    'Hava Birliği',
    550,
    325,
    0,
    2,
    'Hızlı birlik • dengeli saldırı'
  ]

};


const selectedQuantities={};

let loadPromise=null;

let productionPending=false;


function fmt(n){

  return Math.floor(
    Number(n||0)
  ).toLocaleString(
    'tr-TR'
  );

}


function remain(s){

  s=Math.max(
    0,
    Number(s)||0
  );

  return String(
    Math.floor(s/60)
  ).padStart(
    2,
    '0'
  )+
  ':'+
  String(
    s%60
  ).padStart(
    2,
    '0'
  );

}


function selectedQuantity(type){

  const value=
    Number(
      selectedQuantities[type]||1
    );

  if(
    !Number.isInteger(value)||
    value<1
  ){
    return 1;
  }

  return Math.min(
    1000000,
    value
  );

}


function unitResourceCostText(
  d,
  quantity=1
){

  const parts=[
    '⛏️ '+
    fmt(
      d[2]*quantity
    )+
    ' Metal'
  ];


  if(
    Number(d[3]||0)>0
  ){
    parts.push(
      '⚡ '+
      fmt(
        d[3]*quantity
      )+
      ' Enerji'
    );
  }


  if(
    Number(d[4]||0)>0
  ){
    parts.push(
      '🧱 '+
      fmt(
        d[4]*quantity
      )+
      ' Alaşım'
    );
  }


  return parts.join(
    ' + '
  );

}


function updateSelectionCost(type){

  const d=
    defaults[type];

  const el=
    document.getElementById(
      'selectionCost-'+type
    );

  const input=
    document.getElementById(
      'quantity-'+type
    );


  if(
    !d||
    !el||
    !input
  ){
    return;
  }


  const quantity=
    Number(
      input.value
    );


  if(
    !Number.isInteger(quantity)||
    quantity<1||
    quantity>1000000
  ){

    el.textContent=
      '1 ile 1.000.000 arasında tam sayı gir.';

    return;

  }


  selectedQuantities[type]=
    quantity;


  el.textContent=
    'Seçim: ×'+
    fmt(quantity)+
    ' • '+
    unitResourceCostText(
      d,
      quantity
    )+
    ' • 👥 '+
    fmt(
      d[5]*quantity
    );

}


function setQuantity(
  type,
  quantity
){

  const safe=
    Math.max(
      1,
      Math.min(
        1000000,
        Math.floor(
          Number(quantity)||1
        )
      )
    );


  selectedQuantities[type]=
    safe;


  const input=
    document.getElementById(
      'quantity-'+type
    );


  if(input){
    input.value=safe;
  }


  updateSelectionCost(
    type
  );

}


function render(data){

  const units=
    data.units||[];


  document.getElementById(
    'metal'
  ).textContent=
    fmt(
      data.city.metal
    );


  document.getElementById(
    'energy'
  ).textContent=
    fmt(
      data.city.energy
    );


  document.getElementById(
    'alloy'
  ).textContent=
    fmt(
      data.city.alloy
    );


  document.getElementById(
    'crystal'
  ).textContent=
    fmt(
      data.city.crystal
    );


  document.getElementById(
    'population'
  ).textContent=
    fmt(
      data.city.population
    )+
    '/'+
    fmt(
      data.city.population_capacity
    );


  document.getElementById(
    'armyCount'
  ).textContent=
    fmt(
      units.reduce(
        (s,u)=>
          s+
          Number(
            u.quantity||0
          ),
        0
      )
    );


  document.getElementById(
    'armyGrid'
  ).innerHTML=

    Object.entries(
      defaults
    ).map(
      ([type,d])=>{

        const u=
          units.find(
            x=>
              x.unit_type===type
          )||{};


        const qty=
          Number(
            u.quantity||0
          );


        const lvl=
          Number(
            u.level||1
          );


        const chosen=
          selectedQuantity(
            type
          );


        const disabled=
          productionPending
            ?'disabled'
            :'';


        return `
          <div class="card" data-unit-type="${type}">

            <div class="icon">
              ${d[0]}
            </div>

            <h2>
              ${d[1]}
            </h2>

            <div class="level">
              Seviye ${lvl}/15
            </div>

            <div class="qty">
              ${fmt(qty)} asker
            </div>

            <div class="unit-role">
              ${d[6]}
            </div>

            <div class="stats">

              <div>
                <small>
                  Saldırı
                </small>

                <b>
                  ${Number(u.attack||0)}
                </b>
              </div>

              <div>
                <small>
                  Savunma
                </small>

                <b>
                  ${Number(u.defense||0)}
                </b>
              </div>

              <div>
                <small>
                  HP
                </small>

                <b>
                  ${Number(u.hp||0)}
                </b>
              </div>

              <div>
                <small>
                  Hız
                </small>

                <b>
                  ${Number(u.speed||0)}
                </b>
              </div>

            </div>

            <div class="cost">
              Üretim:
              ${unitResourceCostText(d)} •
              Nüfus ${d[5]}
            </div>

            <div class="trainBox">

              <div class="trainTitle">
                Üretim Adedi
              </div>

              <div class="quantityRow">

                <input
                  id="quantity-${type}"
                  class="quantityInput"
                  type="number"
                  min="1"
                  max="1000000"
                  step="1"
                  value="${chosen}"
                  oninput="updateSelectionCost('${type}')"
                >

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',10)"
                >
                  10
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',50)"
                >
                  50
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',100)"
                >
                  100
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',500)"
                >
                  500
                </button>

              </div>

              <div
                class="selectionCost"
                id="selectionCost-${type}"
              ></div>

            </div>

            <button
              class="button produceAction"
              ${disabled}
              onclick="produceSelected('${type}')"
            >
              Seçilen Adedi Üret
            </button>

            <button
              class="button maxButton produceAction"
              ${disabled}
              onclick="produceMax('${type}')"
            >
              Kaynak / Kapasite Kadar MAX
            </button>

            <button
              class="button upgrade"
              ${
                !u.id||lvl>=15
                  ?'disabled'
                  :''
              }
              onclick="upgrade('${type}')"
            >
              ${
                lvl>=15
                  ?'Maksimum Seviye'
                  :'Seviyeyi Yükselt'
              }
            </button>

          </div>
        `;

      }
    ).join('');


  Object.keys(
    defaults
  ).forEach(
    updateSelectionCost
  );


  const q=
    data.productionQueue||[];


  document.getElementById(
    'queueList'
  ).innerHTML=

    q.length
      ?q.map(
        x=>`
          <div class="qitem">
            ${x.unit_type.toUpperCase()}
            ×${x.quantity}

            <span
              class="time"
              data-finish="${x.finish_at}"
            ></span>
          </div>
        `
      ).join('')
      :'Kuyruk boş.';


  updateTimes();

}


function updateTimes(){

  document.querySelectorAll(
    '[data-finish]'
  ).forEach(
    e=>{

      const sec=
        Math.ceil(
          (
            new Date(
              e.dataset.finish
            ).getTime()-
            Date.now()
          )/1000
        );


      e.textContent=
        sec>0
          ?' • '+remain(sec)
          :' • tamamlanıyor';

    }
  );

}


function setProductionDisabled(
  disabled
){

  document.querySelectorAll(
    '.produceAction,.quick'
  ).forEach(
    button=>{

      button.disabled=
        disabled;

    }
  );

}


async function load(){

  if(loadPromise){
    return loadPromise;
  }


  loadPromise=
    (
      async()=>{

        try{

          const r=
            await fetch(
              '/api/auth?action=city',
              {
                method:'POST',

                headers:{
                  Authorization:
                    'Bearer '+token
                }
              }
            );


          const d=
            await r.json();


          if(
            r.status===401
          ){

            clearInvalidSession();

            return;

          }


          if(
            r.ok&&
            d.success
          ){
            render(d);
          }

        }catch(e){

          console.error(e);

        }

      }
    )().finally(
      ()=>{

        loadPromise=null;

      }
    );


  return loadPromise;

}


async function produceSelected(
  type
){

  const input=
    document.getElementById(
      'quantity-'+type
    );


  const quantity=
    Number(
      input?.value
    );


  if(
    !Number.isInteger(quantity)||
    quantity<1||
    quantity>1000000
  ){

    alert(
      'Üretim adedi 1 ile 1.000.000 arasında tam sayı olmalı.'
    );

    return;

  }


  selectedQuantities[type]=
    quantity;


  await produce(
    type,
    quantity
  );

}


async function produceMax(
  type
){

  await produce(
    type,
    null
  );

}


async function produce(
  type,
  quantity
){

  if(
    productionPending
  ){
    return;
  }


  productionPending=
    true;


  setProductionDisabled(
    true
  );


  try{

    const r=
      await fetch(
        '/api/auth?action=army',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',

            Authorization:
              'Bearer '+token
          },

          body:
            JSON.stringify({
              unitType:type,
              quantity:quantity
            })
        }
      );


    const d=
      await r.json();


    if(
      r.status===401
    ){

      clearInvalidSession();

      return;

    }


    if(
      !r.ok||
      !d.success
    ){

      alert(
        d.message||
        'Üretim başlatılamadı.'
      );

      return;

    }


    alert(
      d.message||
      'Üretim sırasına alındı.'
    );


    await load();

  }catch(e){

    alert(
      'Bağlantı hatası'
    );

  }finally{

    productionPending=
      false;


    setProductionDisabled(
      false
    );

  }

}


async function upgrade(
  type
){

  try{

    const r=
      await fetch(
        '/api/auth?action=upgradeunit',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',

            Authorization:
              'Bearer '+token
          },

          body:
            JSON.stringify({
              unitType:type
            })
        }
      );


    const d=
      await r.json();


    if(
      r.status===401
    ){

      clearInvalidSession();

      return;

    }


    if(
      !r.ok||
      !d.success
    ){

      alert(
        d.message||
        'Seviye yükseltilemedi.'
      );

      return;

    }


    await load();

  }catch(e){

    alert(
      'Bağlantı hatası'
    );

  }

}


/* İlk yükleme */
load();


/* Backend polling - üst üste binmez */
setInterval(
  load,
  5000
);


/* Sadece ekrandaki sayaç */
setInterval(
  updateTimes,
  1000
);

</script>

</body>
</html>
