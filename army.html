<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXORA - Ordu</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}
.topbar{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}
.player{color:#9fc0df}
.container{max-width:1250px;margin:30px auto;padding:0 20px}
h1{margin-bottom:6px}
.sub{color:#7196b8}
.resources,.statsbar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}
.res,.stat{background:#091a2c;border:1px solid #173b5d;border-radius:10px;padding:12px}
.stat b{display:block;font-size:18px}
.army-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#091a2c;border:1px solid #173b5d;border-radius:12px;padding:20px}
.icon{font-size:40px}
.level{color:#18bfff;font-weight:bold;margin:8px 0}
.qty{font-size:28px;font-weight:bold;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:#071526;border:1px solid #16344f;border-radius:8px;padding:9px}
.stats small{display:block;color:#7196b8}
.cost{color:#8db0cf;margin:14px 0}

.trainBox{
  background:#071526;
  border:1px solid #17344f;
  border-radius:10px;
  padding:12px;
  margin:14px 0 10px
}

.trainTitle{
  color:#9fc0df;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px
}

.quantityRow{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px
}

.quantityInput{
  grid-column:1/-1;
}

.quantityInput{
  width:100%;
  min-width:0;
  padding:10px;
  border-radius:7px;
  border:1px solid #245276;
  background:#050d18;
  color:#fff;
  font-weight:bold;
  outline:none
}

.quantityInput:focus{
  border-color:#18bfff
}

.quick{
  border:1px solid #245276;
  border-radius:7px;
  background:#102e49;
  color:#8bdcff;
  font-weight:bold;
  cursor:pointer
}

.quick:hover{
  background:#174467
}

.selectionCost{
  min-height:34px;
  color:#8db0cf;
  font-size:12px;
  line-height:1.45;
  margin-top:8px
}

.button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#128fcb;
  color:white;
  font-weight:bold;
  cursor:pointer
}

.button:hover:not(:disabled){
  background:#18bfff
}

.maxButton{
  margin-top:8px;
  background:#7357c8
}

.maxButton:hover:not(:disabled){
  background:#8b6df0
}

.upgrade{
  margin-top:8px;
  background:#1b8f59
}

.upgrade:hover:not(:disabled){
  background:#24ad6e
}

.upgrade:disabled,
.button:disabled,
.quick:disabled{
  opacity:.45;
  cursor:not-allowed
}

.queue{
  background:#091a2c;
  border:1px solid #173b5d;
  border-radius:12px;
  padding:18px;
  margin:20px 0
}

.qitem{
  padding:10px;
  border-bottom:1px solid #17344f
}

.qitem:last-child{
  border-bottom:0
}

.time{
  color:#18bfff;
  font-weight:bold
}

.topBack{
  display:inline-block;
  margin:0 0 18px;
  padding:10px 16px;
  border-radius:8px;
  background:#138dcc;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  border:1px solid #1aa9ee
}

.topBack:hover{
  filter:brightness(1.08)
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#18bfff;
  text-decoration:none
}

@media(max-width:900px){
  .resources,.statsbar{
    grid-template-columns:repeat(2,1fr)
  }
}
  
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">NEXORA</div>

  <div class="player">
    Oyuncu:
    <strong id="playerName">Oyuncu</strong>
  </div>
</div>

<div class="container">

  <a class="topBack" href="game.html">
    ← Koloniye Dön
  </a>

  <h1>⚔️ Ordu</h1>

  <div class="sub">
    Birlik seviyeleri, özel birlik rolleri ve araştırmalar gerçek savaş hesaplamalarında kullanılır.
  </div>

  <div class="resources">

    <div class="res">
      ⛏️ Metal:
      <b id="metal">0</b>
    </div>

    <div class="res">
      ⚡ Enerji:
      <b id="energy">0</b>
    </div>

    <div class="res">
      💧 Su:
      <b id="water">0</b>
    </div>

    <div class="res">
      💎 Kristal:
      <b id="crystal">0</b>
    </div>

    <div class="res">
      👥 Nüfus:
      <b id="population">0/0</b>
    </div>

    <div class="res">
      ⚔️ Aktif Ordu:
      <b id="armyCount">0</b>
    </div>

  </div>

  <div class="queue">
    <h3>🏭 Üretim Kuyruğu</h3>
    <div id="queueList">
      Kuyruk boş.
    </div>
  </div>

  <div
    class="army-grid"
    id="armyGrid"
  ></div>

</div>

<script>

const token=
  localStorage.getItem(
    'nexora_token'
  );

const user=
  JSON.parse(
    localStorage.getItem(
      'nexora_player'
    )||'null'
  );


if(!token){
  location.href='login.html';
}


function clearInvalidSession(){

  localStorage.removeItem(
    'nexora_token'
  );

  localStorage.removeItem(
    'nexora_player'
  );

  location.href=
    'login.html';

}


if(user?.username){

  document.getElementById(
    'playerName'
  ).textContent=
    user.username;

}


const defaults={

  piyade:[
    '🪖',
    'Piyade',
    100,
    20,
    1,
    'Dengeli temel birlik'
  ],

  savunma:[
    '🛡️',
    'Savunma Birliği',
    150,
    40,
    1,
    'Savunma uzmanı • daha az kayıp'
  ],

  saldiri:[
    '🚀',
    'Saldırı Birliği',
    200,
    75,
    1,
    'Yüksek saldırı • daha kırılgan'
  ],

  okcu:[
    '🏹',
    'Okçu',
    220,
    90,
    1,
    'Menzilli saldırı • yüksek saldırı'
  ],

  tank:[
    '🛡️',
    'Tank',
    700,
    220,
    3,
    'Ağır birlik • yüksek dayanıklılık'
  ],

  hava:[
    '✈️',
    'Hava Birliği',
    650,
    260,
    2,
    'Hızlı birlik • dengeli saldırı'
  ]

};


const selectedQuantities={};

let loadPromise=null;

let productionPending=false;


function fmt(n){

  return Math.floor(
    Number(n||0)
  ).toLocaleString(
    'tr-TR'
  );

}


function remain(s){

  s=Math.max(
    0,
    Number(s)||0
  );

  return String(
    Math.floor(s/60)
  ).padStart(
    2,
    '0'
  )+
  ':'+
  String(
    s%60
  ).padStart(
    2,
    '0'
  );

}


function selectedQuantity(type){

  const value=
    Number(
      selectedQuantities[type]||1
    );

  if(
    !Number.isInteger(value)||
    value<1
  ){
    return 1;
  }

  return Math.min(
    1000000,
    value
  );

}


function updateSelectionCost(type){

  const d=
    defaults[type];

  const el=
    document.getElementById(
      'selectionCost-'+type
    );

  const input=
    document.getElementById(
      'quantity-'+type
    );


  if(
    !d||
    !el||
    !input
  ){
    return;
  }


  const quantity=
    Number(
      input.value
    );


  if(
    !Number.isInteger(quantity)||
    quantity<1||
    quantity>1000000
  ){

    el.textContent=
      '1 ile 1.000.000 arasında tam sayı gir.';

    return;

  }


  selectedQuantities[type]=
    quantity;


  el.textContent=
    'Seçim: ×'+
    fmt(quantity)+
    ' • ⛏️ '+
    fmt(
      d[2]*quantity
    )+
    ' • ⚡ '+
    fmt(
      d[3]*quantity
    )+
    ' • 👥 '+
    fmt(
      d[4]*quantity
    );

}


function setQuantity(
  type,
  quantity
){

  const safe=
    Math.max(
      1,
      Math.min(
        1000000,
        Math.floor(
          Number(quantity)||1
        )
      )
    );


  selectedQuantities[type]=
    safe;


  const input=
    document.getElementById(
      'quantity-'+type
    );


  if(input){
    input.value=safe;
  }


  updateSelectionCost(
    type
  );

}


function render(data){

  const units=
    data.units||[];


  document.getElementById(
    'metal'
  ).textContent=
    fmt(
      data.city.metal
    );


  document.getElementById(
    'energy'
  ).textContent=
    fmt(
      data.city.energy
    );


  document.getElementById(
    'water'
  ).textContent=
    fmt(
      data.city.water
    );


  document.getElementById(
    'crystal'
  ).textContent=
    fmt(
      data.city.crystal
    );


  document.getElementById(
    'population'
  ).textContent=
    fmt(
      data.city.population
    )+
    '/'+
    fmt(
      data.city.population_capacity
    );


  document.getElementById(
    'armyCount'
  ).textContent=
    fmt(
      units.reduce(
        (s,u)=>
          s+
          Number(
            u.quantity||0
          ),
        0
      )
    );


  document.getElementById(
    'armyGrid'
  ).innerHTML=

    Object.entries(
      defaults
    ).map(
      ([type,d])=>{

        const u=
          units.find(
            x=>
              x.unit_type===type
          )||{};


        const qty=
          Number(
            u.quantity||0
          );


        const lvl=
          Number(
            u.level||1
          );


        const chosen=
          selectedQuantity(
            type
          );


        const disabled=
          productionPending
            ?'disabled'
            :'';


        return `
          <div class="card">

            <div class="icon">
              ${d[0]}
            </div>

            <h2>
              ${d[1]}
            </h2>

            <div class="level">
              Seviye ${lvl}/15
            </div>

            <div class="qty">
              ${fmt(qty)} asker
            </div>

            <div style="color:#7196b8;margin:-4px 0 12px">
              ${d[5]}
            </div>

            <div class="stats">

              <div>
                <small>
                  Saldırı
                </small>

                <b>
                  ${Number(u.attack||0)}
                </b>
              </div>

              <div>
                <small>
                  Savunma
                </small>

                <b>
                  ${Number(u.defense||0)}
                </b>
              </div>

              <div>
                <small>
                  HP
                </small>

                <b>
                  ${Number(u.hp||0)}
                </b>
              </div>

              <div>
                <small>
                  Hız
                </small>

                <b>
                  ${Number(u.speed||0)}
                </b>
              </div>

            </div>

            <div class="cost">
              Üretim:
              ${d[2]} Metal +
              ${d[3]} Enerji •
              Nüfus ${d[4]}
            </div>

            <div class="trainBox">

              <div class="trainTitle">
                Üretim Adedi
              </div>

              <div class="quantityRow">

                <input
                  id="quantity-${type}"
                  class="quantityInput"
                  type="number"
                  min="1"
                  max="1000000"
                  step="1"
                  value="${chosen}"
                  oninput="updateSelectionCost('${type}')"
                >

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',10)"
                >
                  10
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',50)"
                >
                  50
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',100)"
                >
                  100
                </button>

                <button
                  class="quick"
                  ${disabled}
                  onclick="setQuantity('${type}',500)"
                >
                  500
                </button>

              </div>

              <div
                class="selectionCost"
                id="selectionCost-${type}"
              ></div>

            </div>

            <button
              class="button produceAction"
              ${disabled}
              onclick="produceSelected('${type}')"
            >
              Seçilen Adedi Üret
            </button>

            <button
              class="button maxButton produceAction"
              ${disabled}
              onclick="produceMax('${type}')"
            >
              Kaynak / Kapasite Kadar MAX
            </button>

            <button
              class="button upgrade"
              ${
                !u.id||lvl>=15
                  ?'disabled'
                  :''
              }
              onclick="upgrade('${type}')"
            >
              ${
                lvl>=15
                  ?'Maksimum Seviye'
                  :'Seviyeyi Yükselt'
              }
            </button>

          </div>
        `;

      }
    ).join('');


  Object.keys(
    defaults
  ).forEach(
    updateSelectionCost
  );


  const q=
    data.productionQueue||[];


  document.getElementById(
    'queueList'
  ).innerHTML=

    q.length
      ?q.map(
        x=>`
          <div class="qitem">
            ${x.unit_type.toUpperCase()}
            ×${x.quantity}

            <span
              class="time"
              data-finish="${x.finish_at}"
            ></span>
          </div>
        `
      ).join('')
      :'Kuyruk boş.';


  updateTimes();

}


function updateTimes(){

  document.querySelectorAll(
    '[data-finish]'
  ).forEach(
    e=>{

      const sec=
        Math.ceil(
          (
            new Date(
              e.dataset.finish
            ).getTime()-
            Date.now()
          )/1000
        );


      e.textContent=
        sec>0
          ?' • '+remain(sec)
          :' • tamamlanıyor';

    }
  );

}


function setProductionDisabled(
  disabled
){

  document.querySelectorAll(
    '.produceAction,.quick'
  ).forEach(
    button=>{

      button.disabled=
        disabled;

    }
  );

}


async function load(){

  if(loadPromise){
    return loadPromise;
  }


  loadPromise=
    (
      async()=>{

        try{

          const r=
            await fetch(
              '/api/auth?action=city',
              {
                method:'POST',

                headers:{
                  Authorization:
                    'Bearer '+token
                }
              }
            );


          const d=
            await r.json();


          if(
            r.status===401
          ){

            clearInvalidSession();

            return;

          }


          if(
            r.ok&&
            d.success
          ){
            render(d);
          }

        }catch(e){

          console.error(e);

        }

      }
    )().finally(
      ()=>{

        loadPromise=null;

      }
    );


  return loadPromise;

}


async function produceSelected(
  type
){

  const input=
    document.getElementById(
      'quantity-'+type
    );


  const quantity=
    Number(
      input?.value
    );


  if(
    !Number.isInteger(quantity)||
    quantity<1||
    quantity>1000000
  ){

    alert(
      'Üretim adedi 1 ile 1.000.000 arasında tam sayı olmalı.'
    );

    return;

  }


  selectedQuantities[type]=
    quantity;


  await produce(
    type,
    quantity
  );

}


async function produceMax(
  type
){

  await produce(
    type,
    null
  );

}


async function produce(
  type,
  quantity
){

  if(
    productionPending
  ){
    return;
  }


  productionPending=
    true;


  setProductionDisabled(
    true
  );


  try{

    const r=
      await fetch(
        '/api/auth?action=army',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',

            Authorization:
              'Bearer '+token
          },

          body:
            JSON.stringify({
              unitType:type,
              quantity:quantity
            })
        }
      );


    const d=
      await r.json();


    if(
      r.status===401
    ){

      clearInvalidSession();

      return;

    }


    if(
      !r.ok||
      !d.success
    ){

      alert(
        d.message||
        'Üretim başlatılamadı.'
      );

      return;

    }


    alert(
      d.message||
      'Üretim sırasına alındı.'
    );


    await load();

  }catch(e){

    alert(
      'Bağlantı hatası'
    );

  }finally{

    productionPending=
      false;


    setProductionDisabled(
      false
    );

  }

}


async function upgrade(
  type
){

  try{

    const r=
      await fetch(
        '/api/auth?action=upgradeunit',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',

            Authorization:
              'Bearer '+token
          },

          body:
            JSON.stringify({
              unitType:type
            })
        }
      );


    const d=
      await r.json();


    if(
      r.status===401
    ){

      clearInvalidSession();

      return;

    }


    if(
      !r.ok||
      !d.success
    ){

      alert(
        d.message||
        'Seviye yükseltilemedi.'
      );

      return;

    }


    await load();

  }catch(e){

    alert(
      'Bağlantı hatası'
    );

  }

}


/* İlk yükleme */
load();


/* Backend polling - üst üste binmez */
setInterval(
  load,
  5000
);


/* Sadece ekrandaki sayaç */
setInterval(
  updateTimes,
  1000
);

</script>

</body>
</html>
