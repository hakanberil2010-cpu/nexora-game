<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERYNDIS - Bildirim Merkezi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}
.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}
.container{max-width:1050px;margin:30px auto;padding:0 20px}
.topBack{display:inline-block;margin:0 0 18px;padding:10px 16px;border-radius:8px;background:#138dcc;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #1aa9ee}
.topBack:hover{filter:brightness(1.08)}
h1{margin:0 0 8px}
.sub{color:#7196b8;line-height:1.45}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 16px}
.counter{display:inline-flex;align-items:center;gap:9px;padding:10px 13px;border-radius:10px;background:#091a2c;border:1px solid #173b5d;color:#9cc6e2}
.counter b{color:#18bfff;font-size:20px}
.counterGroup{display:flex;gap:8px;flex-wrap:wrap}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sectionTitle h2{margin:0;font-size:19px}
.sectionLink{color:#18bfff;text-decoration:none;font-size:13px}
.sectionLink:hover{text-decoration:underline}
.socialGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.previewList{display:grid;gap:9px}
.previewItem{display:block;padding:13px;border-radius:11px;background:#091a2c;border:1px solid #173b5d;color:inherit;text-decoration:none}
.previewItem:hover{filter:brightness(1.05)}
.previewItem.unread{border-color:#1aa9ee}
.previewTitle{display:flex;justify-content:space-between;gap:10px;font-weight:bold}
.previewText{margin-top:6px;color:#9cc6e2;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.button{padding:10px 14px;border:0;border-radius:8px;background:#138dcc;color:#fff;font-weight:bold;cursor:pointer}
.button:hover:not(:disabled){filter:brightness(1.08)}
.button:disabled{opacity:.5;cursor:not-allowed}
.status{display:none;margin:12px 0;padding:11px 13px;border-radius:9px;background:#091a2c;border:1px solid #173b5d;color:#8bdcff}
.list{display:grid;gap:12px}
.item{display:block;background:#091a2c;border:1px solid #173b5d;border-radius:13px;padding:16px;text-decoration:none;color:inherit;position:relative}
.item:hover{filter:brightness(1.05)}
.item.unread{border-color:#1aa9ee;box-shadow:0 0 0 1px rgba(26,169,238,.14)}
.item.success{border-left:4px solid #2b8f66}
.item.danger{border-left:4px solid #a84242}
.item.neutral{border-left:4px solid #6c7787}
.itemTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.itemTitle{font-size:18px;font-weight:bold}
.time{font-size:12px;color:#7196b8;white-space:nowrap}
.summary{margin-top:7px;color:#9cc6e2;line-height:1.45}
.meta{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{padding:5px 8px;border-radius:999px;background:#102a44;color:#8bdcff;font-size:12px}
.newBadge{padding:5px 8px;border-radius:999px;background:#123c59;color:#8bdcff;font-size:11px;font-weight:bold}
.empty{padding:20px;background:#091a2c;border:1px solid #173b5d;border-radius:12px;color:#8db0cf;text-align:center}
.back{display:inline-block;margin-top:24px;color:#18bfff;text-decoration:none}
.back:hover{text-decoration:underline}
@media(max-width:700px){
  .top{height:auto;min-height:70px;padding:12px 15px;gap:10px;flex-wrap:wrap}
  .logo{font-size:22px;letter-spacing:4px}
  .top>div:last-child{min-width:0;font-size:13px;overflow-wrap:anywhere}
  .container{padding:0 12px;margin-top:20px}
  .itemTop{display:block}
  .time{display:block;margin-top:7px}
  .socialGrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo">TERYNDIS</div>
  <div>Oyuncu: <strong id="playerName">Oyuncu</strong></div>
</div>

<div class="container">
  <a class="topBack" href="game.html">← Koloniye Dön</a>
  <h1>🔔 Bildirim Merkezi</h1>
  <div class="sub">Oyun aktivitelerini, özel mesajları ve arkadaşlık isteklerini tek yerde takip et.</div>

  <div class="toolbar">
    <div class="counterGroup">
      <div class="counter">Toplam yeni <b id="totalUnreadCount">0</b></div>
      <div class="counter">Aktivite <b id="unreadCount">0</b></div>
      <div class="counter">Mesaj <b id="messageUnreadCount">0</b></div>
      <div class="counter">Arkadaşlık <b id="friendIncomingCount">0</b></div>
    </div>
    <button class="button" id="markSeenButton" type="button" disabled>Aktiviteleri Okundu Say</button>
  </div>

  <div id="status" class="status"></div>

  <div class="socialGrid">
    <section>
      <div class="sectionTitle">
        <h2>✉️ Son Mesajlar</h2>
        <a class="sectionLink" href="messages.html">Tüm mesajlar →</a>
      </div>
      <div id="messageList" class="previewList"></div>
    </section>

    <section>
      <div class="sectionTitle">
        <h2>🤝 Arkadaşlık İstekleri</h2>
        <a class="sectionLink" href="friends.html">Arkadaşlar →</a>
      </div>
      <div id="friendRequestList" class="previewList"></div>
    </section>
  </div>

  <div class="sectionTitle">
    <h2>⚡ Oyun Aktiviteleri</h2>
  </div>
  <div id="activityList" class="list"></div>

  <a class="back" href="game.html">← Koloniye Dön</a>
</div>

<script>
const token=localStorage.getItem('nexora_token');
const user=JSON.parse(localStorage.getItem('nexora_player')||'null');
if(!token)location.href='login.html';
if(user?.username)document.getElementById('playerName').textContent=user.username;

let snapshot=null;
let loadPromise=null;
let markPending=false;

function clearInvalidSession(){
  localStorage.removeItem('nexora_token');
  localStorage.removeItem('nexora_player');
  location.href='login.html';
}

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function numberValue(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(0,Math.floor(n)):0;
}

function showStatus(message){
  const el=document.getElementById('status');
  el.textContent=message||'';
  el.style.display=message?'block':'none';
}

function safeHref(value){
  const allowed=new Set(['reports.html','world.html','missions.html','trade.html','alliance.html']);
  const href=String(value||'');
  return allowed.has(href)?href:'game.html';
}

function typeLabel(type){
  return ({
    pvp_battle:'PvP',
    npc_battle:'PvE',
    world_exploration:'Keşif',
    daily_mission_claim:'Günlük Görev',
    trade_delivery:'Ticaret',
    alliance_activity:'İttifak'
  })[type]||'Aktivite';
}

function formatTime(value){
  if(!value)return '';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  return date.toLocaleString('tr-TR',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function render(data){
  snapshot=data&&typeof data==='object'?data:{};
  const activity=snapshot.activity&&typeof snapshot.activity==='object'
    ?snapshot.activity:{};
  const items=Array.isArray(activity.items)?activity.items:[];
  const messages=Array.isArray(snapshot.messages)?snapshot.messages:[];
  const friendRequests=Array.isArray(snapshot.friendRequests)?snapshot.friendRequests:[];
  const counts=snapshot.counts&&typeof snapshot.counts==='object'?snapshot.counts:{};

  const unread=numberValue(counts.activityUnread);
  const messageUnread=numberValue(counts.messageUnread);
  const friendIncoming=numberValue(counts.friendIncoming);
  const totalUnread=numberValue(snapshot.totalUnread);

  document.getElementById('totalUnreadCount').textContent=totalUnread.toLocaleString('tr-TR');
  document.getElementById('unreadCount').textContent=unread.toLocaleString('tr-TR');
  document.getElementById('messageUnreadCount').textContent=messageUnread.toLocaleString('tr-TR');
  document.getElementById('friendIncomingCount').textContent=friendIncoming.toLocaleString('tr-TR');
  document.getElementById('markSeenButton').disabled=markPending||unread<=0;

  const messageList=document.getElementById('messageList');
  messageList.innerHTML=messages.length
    ?messages.map(item=>
      '<a class="previewItem'+(item?.unread===true?' unread':'')+'" href="messages.html">'+
        '<div class="previewTitle">'+
          '<span>'+escapeHtml(item?.senderUsername||'Oyuncu')+'</span>'+
          '<span class="time">'+escapeHtml(formatTime(item?.createdAt))+'</span>'+
        '</div>'+
        '<div class="previewText">'+escapeHtml(item?.message||'')+'</div>'+
      '</a>'
    ).join('')
    :'<div class="empty">Gösterilecek mesaj yok.</div>';

  const friendList=document.getElementById('friendRequestList');
  friendList.innerHTML=friendRequests.length
    ?friendRequests.map(item=>
      '<a class="previewItem unread" href="friends.html">'+
        '<div class="previewTitle">'+
          '<span>'+escapeHtml(item?.username||'Oyuncu')+'</span>'+
          '<span class="time">'+escapeHtml(formatTime(item?.requestedAt))+'</span>'+
        '</div>'+
        '<div class="previewText">Arkadaşlık isteği gönderdi.</div>'+
      '</a>'
    ).join('')
    :'<div class="empty">Bekleyen arkadaşlık isteği yok.</div>';

  const list=document.getElementById('activityList');
  if(!items.length){
    list.innerHTML='<div class="empty">Henüz gösterilecek aktivite yok.</div>';
    return;
  }

  list.innerHTML=items.map(item=>{
    const tone=['success','danger','neutral'].includes(item?.tone)?item.tone:'neutral';
    const unreadClass=item?.unread===true?' unread':'';
    return '<a class="item '+tone+unreadClass+'" href="'+escapeHtml(safeHref(item?.href))+'">'+
      '<div class="itemTop">'+
        '<div class="itemTitle">'+escapeHtml(item?.title||'Aktivite')+'</div>'+
        '<span class="time">'+escapeHtml(formatTime(item?.occurredAt))+'</span>'+
      '</div>'+
      '<div class="summary">'+escapeHtml(item?.summary||'')+'</div>'+
      '<div class="meta">'+
        '<span class="pill">'+escapeHtml(typeLabel(item?.type))+'</span>'+
        (item?.unread===true?'<span class="newBadge">YENİ</span>':'')+
      '</div>'+
    '</a>';
  }).join('');
}

async function loadActivity(silent=false){
  if(loadPromise)return loadPromise;
  if(!silent)showStatus('Bildirimler yükleniyor...');

  loadPromise=(async()=>{
    try{
      const response=await fetch('/api/auth?action=notifications',{
        method:'POST',
        headers:{Authorization:'Bearer '+token}
      });
      const data=await response.json();

      if(response.status===401){
        clearInvalidSession();
        return;
      }

      if(!response.ok||!data.success){
        showStatus(data.message||'Bildirimler yüklenemedi.');
        return;
      }

      render(data);
      if(!silent)showStatus('');
    }catch(error){
      console.error(error);
      showStatus('Bağlantı hatası.');
    }
  })().finally(()=>{
    loadPromise=null;
  });

  return loadPromise;
}

async function markAllSeen(){
  if(markPending)return;
  markPending=true;
  document.getElementById('markSeenButton').disabled=true;
  showStatus('Aktiviteler okundu olarak işaretleniyor...');

  try{
    const response=await fetch('/api/auth?action=markactivityseen',{
      method:'POST',
      headers:{Authorization:'Bearer '+token}
    });
    const data=await response.json();

    if(response.status===401){
      clearInvalidSession();
      return;
    }

    if(!response.ok||!data.success){
      showStatus(data.message||'Aktivite durumu güncellenemedi.');
      return;
    }

    await loadActivity(true);
    showStatus('Tüm aktiviteler okundu olarak işaretlendi.');
  }catch(error){
    console.error(error);
    showStatus('Bağlantı hatası.');
  }finally{
    markPending=false;
    if(snapshot)render(snapshot);
  }
}

document.getElementById('markSeenButton').addEventListener('click',markAllSeen);
loadActivity();
setInterval(()=>loadActivity(true),15000);
</script>
</body>
</html>
