<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEXORA - Araştırma</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}.container{max-width:1200px;margin:30px auto;padding:0 20px}.sub{color:#7196b8}.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.res,.card{background:#091a2c;border:1px solid #173b5d;border-radius:12px}.res{padding:12px}.res b{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{padding:18px}.icon{font-size:34px}.level{color:#18bfff;font-weight:bold;margin:8px 0}.cost{color:#8db0cf;font-size:13px;margin:10px 0}.timer{color:#ffd36e;font-weight:bold;min-height:20px}.button{width:100%;padding:11px;border:0;border-radius:8px;background:#138dcc;color:#fff;font-weight:bold;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}.status{margin:16px 0;color:#8bdcff}.back{display:inline-block;margin-top:22px;color:#18bfff;text-decoration:none}@media(max-width:700px){.resources{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="top"><div class="logo">NEXORA</div><div>Oyuncu: <strong id="playerName">Oyuncu</strong></div></div><div class="container"><h1>🔬 Araştırma Merkezi</h1><div class="sub">Araştırmalar seviye başına artan maliyet ve gerçek zamanlı süre kullanır.</div><div class="resources"><div class="res">⛏️ Metal <b id="metal">0</b></div><div class="res">⚡ Enerji <b id="energy">0</b></div><div class="res">💎 Kristal <b id="crystal">0</b></div><div class="res">⏱️ Durum <b id="globalTimer">Hazır</b></div></div><div class="status" id="status"></div><div class="grid" id="grid"></div><a class="back" href="game.html">← Koloniye Dön</a></div><script>
let serverClockOffset=0;const token=localStorage.getItem('nexora_token');const u=JSON.parse(localStorage.getItem('nexora_player')||'null');if(!token)location.href='login.html';if(u?.username)document.getElementById('playerName').textContent=u.username;
const R={production:['⚙️','Üretim Teknolojisi','Üretim hızını artırır.',500,150,25],combat:['⚔️','Muharebe','Saldırı savaş etkisini artırır.',700,200,40],defense:['🛡️','Savunma','Savunma etkisini artırır.',600,180,35],crystal:['💎','Kristal Teknolojisi','Kristal üretimini artırır.',800,250,60],general_power:['🌟','Genel Güç','Savaş gücünü artırır.',1000,300,50],unit_attack:['🔥','Birlik Saldırısı','Birlik saldırılarını artırır.',900,250,45],unit_defense:['🧱','Birlik Savunması','Birlik savunmalarını artırır.',850,250,45],unit_hp:['❤️','Birlik HP','Birlik HP değerlerini artırır.',950,275,50],travel_speed:['🚀','Seyahat Hızı','Hareket ve saldırı süresini azaltır.',1200,350,65]};
function remain(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function keyToId(k){return k.replace(/_/g,'-')}
function render(d){const r=d.research||{};document.getElementById('metal').textContent=Math.floor(d.city?.metal||0).toLocaleString('tr-TR');document.getElementById('energy').textContent=Math.floor(d.city?.energy||0).toLocaleString('tr-TR');document.getElementById('crystal').textContent=Math.floor(d.city?.crystal||0).toLocaleString('tr-TR');document.getElementById('grid').innerHTML=Object.entries(R).map(([k,v])=>{const lvl=Number(r[k+'_level']||0);const pending=r.upgrade_ready_at;const left=pending?Math.max(0,Math.ceil((new Date(pending).getTime()-Date.now())/1000)):0;const busy=!!pending;return `<div class="card"><div class="icon">${v[0]}</div><h2>${v[1]}</h2><p>${v[2]}</p><div class="level">Seviye ${lvl}/15</div><div class="cost">Maliyet: ${v[3]*(lvl+1)} Metal + ${v[4]*(lvl+1)} Enerji + ${v[5]*(lvl+1)} Kristal</div><div class="timer">${busy?'⏱️ '+remain(left):'Hazır'}</div><button class="button" ${busy||lvl>=15?'disabled':''} onclick="research('${k}')">${lvl>=15?'Maksimum':busy?'Araştırılıyor':'Araştır'}</button></div>`}).join('');document.getElementById('globalTimer').textContent=r.upgrade_ready_at?remain(Math.max(0,Math.ceil((new Date(r.upgrade_ready_at).getTime()-Date.now())/1000))):'Hazır';}
async function load(){try{const r=await fetch('/api/auth?action=research',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(r.ok&&d.success)render(d)}catch(e){console.error(e)}}async function research(k){document.getElementById('status').textContent='Araştırma başlatılıyor...';try{const r=await fetch('/api/auth?action=upgradeResearch',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({researchType:k})});const d=await r.json();document.getElementById('status').textContent=d.message||'';load()}catch(e){document.getElementById('status').textContent='Bağlantı hatası.'}}load();setInterval(load,5000);
</script></body></html>
