<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TERYNDIS - Sıralama</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050d18;color:#eaf4ff}.top{height:76px;background:#071526;border-bottom:1px solid #173451;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-size:30px;font-weight:bold;letter-spacing:6px;color:#18bfff}.container{max-width:1200px;margin:30px auto;padding:0 20px}.sub{color:#7196b8}.table{margin-top:20px;background:#091a2c;border:1px solid #173b5d;border-radius:12px;overflow:auto}.row{display:grid;grid-template-columns:70px 1.5fr 1fr 90px 120px 90px 90px 90px;min-width:850px;padding:14px 16px;border-bottom:1px solid #17344f;align-items:center}.head{background:#071526;color:#7196b8;font-size:12px;text-transform:uppercase}.row.me{box-shadow:inset 3px 0 0 #18bfff}.rank{font-size:20px;font-weight:bold}.score{font-size:20px;font-weight:bold;color:#18bfff}.mebox{margin-top:16px;padding:12px 14px;background:#071526;border:1px solid #173b5d;border-radius:10px;color:#9fc3df}.mebox strong{color:#18bfff}.profileLink{color:#dff4ff;text-decoration:none}.profileLink:hover{color:#18bfff;text-decoration:underline}.topBack{display:inline-block;margin:0 0 18px;padding:10px 16px;border-radius:8px;background:#138dcc;color:#fff;text-decoration:none;font-weight:bold;border:1px solid #1aa9ee}.topBack:hover{filter:brightness(1.08)}.back{display:inline-block;margin-top:22px;color:#18bfff;text-decoration:none}
@media(max-width:600px){.top{height:auto;min-height:70px;padding:12px 14px;gap:10px;flex-wrap:wrap}.logo{font-size:24px;letter-spacing:4px}.top>div:last-child{min-width:0;font-size:13px;overflow-wrap:anywhere}.container{margin:20px auto;padding:0 12px}}
</style></head><body><div class="top"><div class="logo">TERYNDIS</div><div>Oyuncu: <strong id="player">Oyuncu</strong></div></div><div class="container"><a class="topBack" href="game.html">← Koloniye Dön</a><h1>🏆 Sıralama</h1><div class="sub">Toplam puan; koloni, bina, araştırma, gerçek asker gücü ve kazanılan savaş puanından hesaplanır.</div><div id="me" class="mebox">Sıralama yükleniyor...</div><div class="table"><div class="row head"><div>Sıra</div><div>Oyuncu</div><div>Puan</div><div>Koloni</div><div>Asker Gücü</div><div>Savaş P.</div><div>Galibiyet</div><div>Araştırma</div></div><div id="rows"></div></div></div><script>
const token=localStorage.getItem('nexora_token');if(!token)location.href='login.html';const u=JSON.parse(localStorage.getItem('nexora_player')||'null');if(u?.username)document.getElementById('player').textContent=u.username;
function clearInvalidSession(){localStorage.removeItem('nexora_token');localStorage.removeItem('nexora_player');location.href='login.html';}
let rankingLoadPromise=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){
  if(rankingLoadPromise)return rankingLoadPromise;

  rankingLoadPromise=(async()=>{
    try{
      const r=await fetch('/api/auth?action=rankings',{
        method:'POST',
        headers:{Authorization:'Bearer '+token}
      });

      const d=await r.json();

      if(r.status===401){
        clearInvalidSession();
        return;
      }

      if(!r.ok||!d.success){
        throw new Error(d.message||'Sıralama yüklenemedi.');
      }

      document.getElementById('rows').innerHTML=(d.rankings||[]).map(x=>`<div class="row ${x.is_me?'me':''}"><div class="rank">#${x.rank}</div><div><a class="profileLink" href="profile.html?username=${encodeURIComponent(String(x.username||''))}"><strong>${esc(x.username)}</strong></a>${x.is_me?' <small>(Sen)</small>':''}</div><div class="score">${Math.round(x.score).toLocaleString('tr-TR')}</div><div>${x.colony_level}</div><div>${Math.round(x.army_power).toLocaleString('tr-TR')}</div><div>${Math.round(x.battle_points).toLocaleString('tr-TR')}</div><div>${x.wins}</div><div>${Math.round(x.research_level)}</div></div>`).join('');

      const me=d.me;
      document.getElementById('me').innerHTML=me
        ?`Senin sıralaman: <strong>#${me.rank}</strong> · Puan: <strong>${Math.round(me.score).toLocaleString('tr-TR')}</strong> · Savaş puanı: ${Math.round(me.battle_points).toLocaleString('tr-TR')}`
        :'Sıralama bilgisi bulunamadı.';
    }catch(e){
      console.error(e);
      document.getElementById('me').textContent='⚠️ Sıralama verisi alınamadı. Birazdan yeniden denenecek.';
    }
  })().finally(()=>{
    rankingLoadPromise=null;
  });

  return rankingLoadPromise;
}
load();setInterval(load,15000);
</script></body></html>
