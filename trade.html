
<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nexora - Ticaret</title>
<style>
body{margin:0;background:#0b1020;color:#eaf1ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#131b31;border:1px solid #2a395f;border-radius:14px;padding:18px;margin-bottom:16px}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:13px;color:#9fb1d4;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #34466f;background:#0c1427;color:#fff}.btn{border:0;border-radius:9px;padding:11px 14px;background:#2b67f6;color:#fff;cursor:pointer}.btn.danger{background:#8d3145}.btn:disabled{opacity:.5;cursor:not-allowed}.offer{border:1px solid #2a395f;border-radius:12px;padding:14px;margin-top:10px;background:#0e162a}.muted{color:#9fb1d4;font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.msg{padding:10px;border-radius:8px;background:#0e162a;margin-bottom:12px;min-height:18px}.resource{font-weight:700}.history{font-size:13px;border-top:1px solid #263555;padding-top:10px;margin-top:10px}
</style></head><body><div class="wrap"><h1>🤝 Ticaret Pazarı</h1><div class="msg" id="msg"></div>
<div class="card"><h2>Yeni Teklif</h2><div class="grid"><div><label>Verilecek kaynak</label><select id="give"><option value="metal">Metal</option><option value="energy">Enerji</option><option value="water">Su</option><option value="crystal">Kristal</option></select></div><div><label>Miktar</label><input id="giveAmount" type="number" min="1" value="500"></div><div><label>İstenen kaynak</label><select id="want"><option value="energy">Enerji</option><option value="metal">Metal</option><option value="water">Su</option><option value="crystal">Kristal</option></select></div><div><label>Miktar</label><input id="wantAmount" type="number" min="1" value="300"></div><div><label>Teklif süresi</label><select id="hours"><option value="6">6 saat</option><option value="24" selected>24 saat</option><option value="48">48 saat</option><option value="72">72 saat</option></select></div></div><br><button class="btn" onclick="createOffer()">Teklif Oluştur</button><p class="muted">Verdiğin kaynak teklif açık kaldığı sürece koloninden ayrılır ve teklif kabul edilmezse iptal ile geri döner.</p></div>
<div class="card"><div class="row"><h2>Açık Teklifler</h2><button class="btn" onclick="loadOffers()">Yenile</button></div><div id="offers"></div></div>
<div class="card"><h2>Ticaret Geçmişi</h2><div id="history"></div></div></div>
<script>
const API="/api/auth.js";let token=localStorage.getItem("nexora_token")||localStorage.getItem("token")||"";
const names={metal:"Metal",energy:"Enerji",water:"Su",crystal:"Kristal"};
function headers(){return {"Content-Type":"application/json",Authorization:"Bearer "+token}}function msg(t){document.getElementById("msg").textContent=t||""}
async function post(action,body={}){const r=await fetch(API+"?action="+action,{method:"POST",headers:headers(),body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||d.success===false)throw new Error(d.message||"İşlem başarısız.");return d}
async function createOffer(){try{const d=await post("createtrade",{giveResource:give.value,giveAmount:+giveAmount.value,wantResource:want.value,wantAmount:+wantAmount.value,durationHours:+hours.value});msg(d.message);await loadOffers();}catch(e){msg("❌ "+e.message)}}
async function acceptOffer(id){if(!confirm("Bu ticareti kabul etmek istiyor musun?"))return;try{const d=await post("accepttrade",{offerId:id});msg(d.message);await loadOffers();await loadHistory();}catch(e){msg("❌ "+e.message)}}
async function cancelOffer(id){if(!confirm("Teklifi iptal edip verdiğin kaynağı geri almak istiyor musun?"))return;try{const d=await post("canceltrade",{offerId:id});msg(d.message);await loadOffers();}catch(e){msg("❌ "+e.message)}}
async function loadOffers(){try{const d=await post("tradeoffers");const el=document.getElementById("offers");if(!d.offers?.length){el.innerHTML='<p class="muted">Açık teklif yok.</p>';return}el.innerHTML=d.offers.map(o=>{const own=String(o.creator_player_id)===String(localStorage.getItem("nexora_player_id")||"");const expired=o.expires_at&&new Date(o.expires_at)<new Date();return '<div class="offer"><div class="row"><strong>'+o.creator_username+'</strong><span class="muted">'+(o.expires_at?new Date(o.expires_at).toLocaleString("tr-TR"):"")+'</span></div><p><span class="resource">'+o.give_amount+' '+names[o.give_resource]+'</span> ➜ <span class="resource">'+o.want_amount+' '+names[o.want_resource]+'</span></p>'+(!expired&& !own?'<button class="btn" onclick="acceptOffer('+o.id+')">Kabul Et</button>':'')+(own&&o.status==='open'?'<button class="btn danger" onclick="cancelOffer('+o.id+')">İptal Et</button>':'')+'</div>'}).join("")}catch(e){document.getElementById("offers").textContent="❌ "+e.message}}
async function loadHistory(){try{const d=await post("tradehistory");const el=document.getElementById("history");if(!d.history?.length){el.innerHTML='<p class="muted">Henüz ticaret yok.</p>';return}el.innerHTML=d.history.map(x=>'<div class="history">'+new Date(x.created_at).toLocaleString("tr-TR")+' — '+x.give_amount+' '+names[x.give_resource]+' karşılığında '+x.want_amount+' '+names[x.want_resource]+'</div>').join("")}catch(e){document.getElementById("history").textContent="❌ "+e.message}}
loadOffers();loadHistory();setInterval(loadOffers,15000);setInterval(loadHistory,30000);
</script></body></html>
